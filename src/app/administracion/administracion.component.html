<app-shell *ngIf="session.user">
<div class="page-panel">
        <div class="listado-titulo-container">
          <h2 class="listado-titulo-principal">{{ title }}</h2>
        </div>

        <div class="admin-cards">
          <div class="admin-card">
            <i class="bi bi-gear admin-card__icon"></i>
            <h3 class="admin-card__title">Configuración</h3>
            <p class="admin-card__desc">Opciones de configuración del sistema (próximamente)</p>
          </div>
          <div class="admin-card">
            <i class="bi bi-people admin-card__icon"></i>
            <h3 class="admin-card__title">Usuarios</h3>
            <p class="admin-card__desc">Gestión de usuarios y permisos (próximamente)</p>
          </div>
          <div class="admin-card">
            <i class="bi bi-shield-check admin-card__icon"></i>
            <h3 class="admin-card__title">Seguridad</h3>
            <p class="admin-card__desc">Auditoría y políticas de acceso (próximamente)</p>
          </div>
        </div>
      </div>
</app-shell>

<!-- ASIGNAR A -->
<app-modal-shell
  modalId="asignarModal"
  titleId="asignarModalLabel"
  modalClass="iflow-modal iflow-modal--fit soli-asignar-modal"
  dialogClass="modal-lg modal-dialog-centered"
  [staticBackdrop]="true"
  [keyboard]="false"
  (closed)="s.cerrarModal('asignarModal')"
>
  <span modalTitle><i class="fas fa-user-plus me-2"></i>Asignar Solicitud</span>
  <form
    modalBody
    id="formAsignarSolicitud"
    #asignarForm="ngForm"
    (ngSubmit)="s.onAsignarSubmit()"
  >
    <div class="mb-3">
      <div class="form-floating">
        <select
          class="form-select"
          id="asignado"
          name="asignado"
          [(ngModel)]="s.editasolicitud.usuario"
          required
          [class.is-invalid]="s.isUsuarioAsignadoInvalid()"
          [class.form-select--placeholder]="!s.editasolicitud.usuario"
          #usuarioSelect="ngModel"
        >
          <option [ngValue]="''" disabled>Selecciona un usuario</option>
          <option *ngFor="let usupermiso of s.usupermisos" [ngValue]="usupermiso.usuario">
            {{ usupermiso.usuario }}
          </option>
        </select>
        <label for="asignado">Asignar Solicitud *</label>
      </div>
      <div *ngIf="s.isUsuarioAsignadoInvalid()" class="invalid-feedback">
        Debe seleccionar un usuario
      </div>
    </div>
  </form>

  <div modalFooter class="modal-footer__actions">
    <button
      type="button"
      class="btn-iflow modal-footer__btn btn-iflow--secondary"
      data-bs-dismiss="modal"
      (click)="s.cerrarModal('asignarModal')"
    >
      <i class="fas fa-times me-1"></i>Cancelar
    </button>
    <button
      type="submit"
      form="formAsignarSolicitud"
      class="btn-iflow modal-footer__btn btn-iflow--primary"
      [disabled]="s.isAsignando"
    >
      <span *ngIf="s.isAsignando" class="spinner-border spinner-border-sm me-2" role="status"></span>
      <i *ngIf="!s.isAsignando" class="fas fa-save me-1"></i>
      {{ s.isAsignando ? 'Guardando...' : 'Guardar' }}
    </button>
  </div>
</app-modal-shell>

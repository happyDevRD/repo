<!-- NUEVO DOCUMENTO -->
<app-modal-shell
  modalId="documentoModal"
  title="Nuevo Documento"
  titleId="exampleModalLabel"
  modalClass="iflow-modal iflow-modal--fit soli-documento-modal"
  dialogClass="modal-lg modal-dialog-centered"
  (closed)="s.cerrarModal('documentoModal')"
>
  <form modalBody id="formNuevoDocumento" enctype="multipart/form-data">
    <div class="row g-3">
      <div class="col-12">
        <div class="form-floating">
          <textarea
            class="form-control"
            required
            id="descripcion"
            name="descripcion"
            [(ngModel)]="s.descripcionArchivo"
            placeholder=" "
            rows="3"
          ></textarea>
          <label for="descripcion">Descripción *</label>
        </div>
      </div>
      <div class="col-12">
        <div class="form-floating">
          <input
            #fileInput
            class="form-control"
            (change)="s.upload($event, s.idsolicitud)"
            type="file"
            id="formFile"
            accept=".pdf,.docx,.odt,.jpg,.jpeg,.png"
          >
          <label for="formFile">Nuevo Documento * (PDF, DOCX, ODT, JPG, PNG)</label>
        </div>
      </div>
    </div>
    <div *ngIf="s.subidaArchivo" class="text-center my-3">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Subiendo...</span>
      </div>
      <div>Subiendo archivo...</div>
    </div>
  </form>

  <div modalFooter class="modal-footer__actions">
    <button
      type="button"
      class="btn-iflow modal-footer__btn btn-iflow--secondary"
      (click)="s.cancelarDocumento(); s.cerrarModal('documentoModal')"
    >
      Cancelar
    </button>
    <button
      type="button"
      class="btn-iflow modal-footer__btn btn-iflow--primary"
      (click)="s.guardarDocumento()"
      [disabled]="s.subidaArchivo"
    >
      Guardar
    </button>
  </div>
</app-modal-shell>

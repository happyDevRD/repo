<app-modal-shell
  modalId="VerPdfModal"
  [title]="s.nombreArchivoSubido ? ('Documento — ' + s.nombreArchivoSubido) : 'Vista del documento'"
  titleId="VerPdfModalLabel"
  dialogClass="modal-fullscreen modal-dialog-centered"
  (closed)="s.cerrarModalPdf()"
>
  <div modalBody class="soli-pdf-modal">
    <ng-container *ngIf="s.pdfSafeUrl; else pdfVacio">
      <iframe
        [src]="s.pdfSafeUrl"
        class="soli-pdf-modal__frame"
        title="Vista del documento PDF"
      ></iframe>
    </ng-container>
    <ng-template #pdfVacio>
      <div class="soli-empty-state soli-empty-state--modal" role="status">
        <i class="bi bi-file-earmark-x soli-empty-state__icon" aria-hidden="true"></i>
        <p class="soli-empty-state__title">No hay documento para mostrar</p>
        <p class="soli-empty-state__desc">
          Seleccione un PDF en el listado y pulse Ver, o use doble clic sobre la fila.
        </p>
      </div>
    </ng-template>
  </div>
  <div modalFooter>
    <button
      *ngIf="s.pdfViewerUrl"
      type="button"
      class="btn-iflow modal-footer__btn btn-iflow--secondary"
      (click)="s.abreArchivo(s.pdfViewerUrl)"
    >
      <i class="bi bi-box-arrow-up-right" aria-hidden="true"></i> Abrir en pestaña
    </button>
    <button
      type="button"
      class="btn-iflow modal-footer__btn btn-iflow--secondary"
      data-bs-dismiss="modal"
      (click)="s.cerrarModalPdf()"
    >
      Cerrar
    </button>
  </div>
</app-modal-shell>

<section class="soli-alta__section" aria-labelledby="soli-alta-datos-title">
  <header class="soli-alta__head">
    <span class="soli-alta__step" aria-hidden="true">1</span>
    <div>
      <h3 id="soli-alta-datos-title" class="soli-alta__title">Solicitud</h3>
      <p class="soli-alta__desc">Nº, Fecha, Asunto, Estado, Instructor y Expediente.</p>
    </div>
  </header>

  <div class="row g-3">
    <div class="col-md-2">
      <div class="form-floating">
        <input
          type="text"
          class="form-control"
          id="soli-alta-numero"
          name="numeroSolicitud"
          [value]="numeroSolicitudPreview"
          disabled
          placeholder=" "
          tabindex="-1"
        >
        <label for="soli-alta-numero">Nº</label>
      </div>
    </div>

    <div class="col-md-3">
      <div class="form-floating">
        <input
          class="form-control"
          (change)="s.gestionEjercicio()"
          type="date"
          id="soli-alta-fecha"
          name="fecInicio"
          [(ngModel)]="s.creasolicitud.fecInicio"
          required
          placeholder=" "
          [disabled]="s.formReadonly"
          [class.is-invalid]="s.isFechaFormInvalid()"
          [attr.aria-invalid]="s.isFechaFormInvalid() || null"
          [attr.aria-describedby]="s.isFechaFormInvalid() ? 'soli-alta-fecha-err' : null"
        >
        <label class="required-field" for="soli-alta-fecha">Fecha</label>
      </div>
      <div *ngIf="s.isFechaFormInvalid()" id="soli-alta-fecha-err" class="invalid-feedback d-block" role="alert">
        La fecha es obligatoria
      </div>
    </div>

    <div class="col-md-3">
      <div class="form-floating">
        <select
          class="form-select"
          id="soli-alta-estado"
          name="estado"
          [(ngModel)]="s.creasolicitud.estado"
          disabled
          tabindex="-1"
        >
          <option value="PENDIENTE">Pendiente</option>
          <option value="ACEPTADA">Aceptada</option>
          <option value="RECHAZADA">Rechazada</option>
        </select>
        <label for="soli-alta-estado">Estado</label>
      </div>
    </div>

    <div class="col-md-4">
      <div class="form-floating">
        <select
          class="form-select"
          id="soli-alta-instructor"
          name="instructor"
          [(ngModel)]="s.creasolicitud.usuario"
          [disabled]="s.formReadonly"
          [class.form-select--placeholder]="!s.creasolicitud.usuario"
        >
          <option [ngValue]="''">Sin instructor</option>
          <option *ngFor="let procedipermisos of s.procedipermiso; trackBy: trackByUsuario"
            [ngValue]="procedipermisos.usuario">{{ procedipermisos.usuario }}</option>
        </select>
        <label for="soli-alta-instructor">Instructor</label>
      </div>
    </div>

    <div class="col-12">
      <div class="form-floating">
        <input
          type="text"
          class="form-control"
          id="soli-alta-asunto"
          name="asunto"
          [(ngModel)]="s.creasolicitud.asunto"
          required
          placeholder=" "
          [disabled]="s.formReadonly"
          [class.is-invalid]="s.isAsuntoFormInvalid()"
          [attr.aria-invalid]="s.isAsuntoFormInvalid() || null"
          [attr.aria-describedby]="s.isAsuntoFormInvalid() ? 'soli-alta-asunto-err' : null"
        >
        <label class="required-field" for="soli-alta-asunto">Asunto</label>
      </div>
      <div *ngIf="s.isAsuntoFormInvalid()" id="soli-alta-asunto-err" class="invalid-feedback d-block" role="alert">
        El asunto es obligatorio
      </div>
    </div>

    <div class="col-md-4">
      <div class="form-floating">
        <input
          type="text"
          class="form-control"
          id="soli-alta-expediente"
          name="expediente"
          [value]="expedientePreview"
          disabled
          placeholder=" "
          tabindex="-1"
        >
        <label for="soli-alta-expediente">Expediente</label>
      </div>
    </div>

    <div class="col-md-8">
      <div class="form-floating">
        <input
          type="text"
          class="form-control"
          disabled
          id="soli-alta-departamento"
          [value]="s.depart"
          name="departamento"
          placeholder=" "
          tabindex="-1"
        >
        <label for="soli-alta-departamento">Departamento</label>
      </div>
    </div>
  </div>
</section>

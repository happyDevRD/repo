<header class="d-flex flex-wrap align-items-end justify-content-between gap-3 mb-3 pb-3 border-bottom">
  <div>
    <p class="text-uppercase small fw-semibold text-secondary mb-1" style="letter-spacing:.06em">Gestion</p>
    <h2 class="h4 fw-bold mb-0">Solicitudes</h2>
    <p class="small text-secondary mb-0 mt-1">
      Alta, seguimiento y conversion a expediente de las solicitudes del departamento.
    </p>
  </div>
  <div class="d-flex flex-wrap gap-2">
    <button
      id="btn-nueva-solicitud"
      class="btn-iflow btn-iflow--primary"
      type="button"
      (click)="handleNuevaSolicitud()"
      aria-haspopup="dialog"
    >
      <i class="bi bi-plus-lg" aria-hidden="true"></i> Nueva solicitud
    </button>
  </div>
</header>

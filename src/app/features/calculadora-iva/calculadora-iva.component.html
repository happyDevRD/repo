<div class="iva-container">
  <h3>Calculadora de IVA</h3>

  <!-- Selección del Tipo IVA -->
  <div class="form-group">
    <label for="tipoIVA">Tipo IVA (%)</label>
    <select id="tipoIVA" [(ngModel)]="tipoIVA" name="tipoIVA" required (ngModelChange)="calcularImportes()">
      <option [value]="0">0%</option>
      <option [value]="4">4%</option>
      <option [value]="21">21%</option>
    </select>
  </div>

  <!-- Importe Total -->
  <div class="form-group">
    <label for="impTotal">Importe Total (€)</label>
    <input type="number" step="0.01" id="impTotal" [(ngModel)]="impTotal" name="impTotal" required (ngModelChange)="calcularImportes()">
  </div>

  <!-- Importe Descuento -->
  <div class="form-group">
    <label for="impDto">Importe Descuento (€)</label>
    <input type="number" step="0.01" id="impDto" [(ngModel)]="impDto" name="impDto" required (ngModelChange)="calcularImportes()">
  </div>

  <!-- Importe IVA (Calculado) -->
  <div class="form-group">
    <label for="impIva">Importe IVA (€)</label>
    <input type="text" id="impIva" class="readonly" readonly [value]="impIva | number:'1.2-2'">
  </div>

  <!-- Importe Líquido (Calculado) -->
  <div class="form-group">
    <label for="impLiqui">Importe Líquido (€)</label>
    <input type="text" id="impLiqui" class="readonly" readonly [value]="impLiqui | number:'1.2-2'">
  </div>
</div>

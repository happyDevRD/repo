<div class="page-panel">
  <div class="expediente-header-container" *ngIf="!i.modal">
    <div class="expediente-titulo-info">
      <h3 class="expediente-titulo">
        Expediente:
        <span class="expediente-numero">{{ i.verexpediente.ejercicio }}/{{ i.verexpediente.numero }}</span>
      </h3>
    </div>
    <div class="expediente-botones-navegacion">
      <button type="button" class="btn-iflow btn-iflow--secondary" (click)="i.volverListadoExpedientes()">
        Volver al listado
      </button>
    </div>
  </div>

  <header class="d-flex flex-wrap align-items-end justify-content-between gap-3 mb-3 pb-3 border-bottom">
    <div>
      <p class="text-uppercase small fw-semibold text-secondary mb-1" style="letter-spacing:.06em">Expediente</p>
      <h2 class="h4 fw-bold mb-0" *ngIf="!i.modal">Interesados del expediente</h2>
      <span *ngIf="i.modal" class="expediente-numero">{{ i.verexpediente.ejercicio }}/{{ i.verexpediente.numero }}</span>
    </div>
    <div class="d-flex flex-wrap gap-2">
      <button type="button" class="btn-iflow btn-iflow--icon" title="Nuevo interesado" aria-label="Nuevo interesado"
              (click)="i.abrirModal('ninteresadoModal')">
        <i class="bi bi-plus-lg" aria-hidden="true"></i>
      </button>
      <button *ngIf="i.veoBorraInteresado" type="button" class="btn-iflow btn-iflow--icon" title="Borrar interesado" aria-label="Borrar interesado"
              (click)="i.borrarinteresados()">
        <i class="bi bi-trash" aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <div class="grid-container">
    <app-iflow-grid
      #grid
      selectionMode="radio"
      radioName="Interesados"
      (rowClick)="i.clickInteresado($event)"
      (rowDoubleClick)="i.abrirModalVerInteresado($event)"
      [columns]="i.columnsInteresado"
      [showfilterrow]="true"
      [localization]="i.localizationObject"
      [source]="i.sourceInteresado">
    </app-iflow-grid>
  </div>
</div>

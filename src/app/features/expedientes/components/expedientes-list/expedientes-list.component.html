<section class="expedientes-listado" aria-label="Listado de expedientes">
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-2">
    <h3 class="expedientes-listado__titulo mb-0">Listado</h3>
    <div class="d-flex flex-wrap align-items-center gap-2">
      <span *ngIf="e.insideDryRun" class="badge bg-info text-dark" title="Sin acceso REDSARA">
        INSIDE simulación
      </span>
      <span *ngIf="e.insidePendientesCount > 0" class="badge bg-warning text-dark">
        {{ e.insidePendientesCount }} pendiente(s) INSIDE
      </span>
      <span *ngIf="e.insidePendientesErrorCount > 0" class="badge bg-danger">
        {{ e.insidePendientesErrorCount }} error(es) INSIDE
      </span>
      <button class="btn-iflow btn-iflow--secondary btn-iflow--sm"
              type="button"
              [class.btn-iflow--primary]="e.filtroInsidePendientes"
              title="Mostrar solo expedientes pendientes de envío a INSIDE"
              (click)="e.toggleFiltroInsidePendientes()">
        <i class="bi bi-funnel" aria-hidden="true"></i>
        {{ e.filtroInsidePendientes ? 'Ver todos' : 'Pendientes INSIDE' }}
      </button>
    </div>
  </div>

  <app-data-table [items]="e.expedientesListado" [loading]="e.cargandoExpedientesListado"
    emptyMessage="No hay expedientes."
    searchPlaceholder="Buscar por título, procedimiento o interesado…"
    exportFileName="expedientes"
    [rowClass]="e.expedienteRowClass"
    (rowClick)="e.marcaExpedienteNuevo($event)"
    (rowDblClick)="e.onExpedienteDoubleClick($event)">
    <app-table-column header="Ejercicio" field="ejercicio" [sortable]="true" align="center" width="6%"></app-table-column>
    <app-table-column header="Número" field="numero" [sortable]="true" align="center" width="6%"></app-table-column>
    <app-table-column header="Título" field="titulo" [sortable]="true"></app-table-column>
    <app-table-column header="Forma apertura" field="formaApertura" [sortable]="true" [filterable]="true" align="center"></app-table-column>
    <app-table-column header="Estado" field="estado" [sortable]="true" [filterable]="true" align="center">
      <ng-template let-row>
        <span class="estado-badge" [ngClass]="'estado-badge--' + (row.estado || '').toLowerCase()">{{ row.estado || '-' }}</span>
      </ng-template>
    </app-table-column>
    <app-table-column header="INSIDE" field="insideEstado" [sortable]="true" [filterable]="true" align="center">
      <ng-template let-row>
        <span *ngIf="row.insideEstado; else sinInside" class="badge" [ngClass]="e.insideBadgeClass(row.insideEstado)">{{ row.insideEstado }}</span>
        <ng-template #sinInside>-</ng-template>
      </ng-template>
    </app-table-column>
    <app-table-column header="Fecha expediente" field="fecInicio" [sortable]="true" [filterable]="true" filterType="dateRange" align="center">
      <ng-template let-row>{{ row.fecInicio | date:'dd/MM/yyyy' }}</ng-template>
    </app-table-column>
    <app-table-column header="Procedimiento" [sortValue]="e.procedimientoDescripcionValue" [searchValue]="e.procedimientoDescripcionValue" [sortable]="true">
      <ng-template let-row>{{ row.procedimiento?.descripcion }}</ng-template>
    </app-table-column>
    <app-table-column header="Instructor" field="instructor" [sortable]="true" [filterable]="true" align="center"></app-table-column>
    <app-table-column header="Interesado" [sortValue]="e.interesadoNombreValue" [searchValue]="e.interesadoNombreValue" [sortable]="true">
      <ng-template let-row>{{ row.personaEntidad?.desPerEntid }}</ng-template>
    </app-table-column>
  </app-data-table>
</section>

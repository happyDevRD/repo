<section class="expediente-workspace" aria-label="Acciones del expediente">
  <div class="expediente-toolbar">
    <p class="expediente-toolbar__empty mb-0" *ngIf="!e.editExpedientes">
      Seleccione un expediente en la tabla para habilitar las acciones.
    </p>

    <ul class="nav nav-tabs expediente-flujo-tabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button type="button"
                class="nav-link"
                [class.active]="e.pestanaFlujo === 'tramitacion'"
                (click)="e.handlePestanaFlujo('tramitacion')"
                role="tab"
                [attr.aria-selected]="e.pestanaFlujo === 'tramitacion'">
          Tramitación
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button type="button"
                class="nav-link"
                [class.active]="e.pestanaFlujo === 'inside'"
                (click)="e.handlePestanaFlujo('inside')"
                role="tab"
                [attr.aria-selected]="e.pestanaFlujo === 'inside'">
          INSIDE
        </button>
      </li>
    </ul>

    <nav class="expediente-acciones" aria-label="Barra de acciones">
      <app-modal-action-bar *ngIf="e.pestanaFlujo === 'tramitacion'"
        containerClass="expediente-acciones__fila" size="sm"
        [actions]="actionsTramitacion" (action)="handleAccionTramitacion($event)">
      </app-modal-action-bar>

      <app-modal-action-bar *ngIf="e.pestanaFlujo === 'inside'"
        containerClass="expediente-acciones__fila" size="sm"
        [actions]="actionsInside" (action)="handleAccionInside($event)">
      </app-modal-action-bar>
    </nav>
  </div>
</section>

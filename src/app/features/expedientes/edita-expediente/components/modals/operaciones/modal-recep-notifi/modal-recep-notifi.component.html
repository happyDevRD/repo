<app-modal-shell
     modalId="RecepNotifi"
     title="Recepción de Notificación"
     titleId="RecepNotifiLabel"
     modalClass="iflow-modal iflow-modal--fit exp-notifi-accion-modal"
     dialogClass="modal-lg"
     [staticBackdrop]="true"
     [keyboard]="false"
     [dismissOnClose]="false"
     (closed)="notif.borraDatosRecepcion()">
     <form modalBody id="formRecepNotifi" novalidate [formGroup]="form" (ngSubmit)="handleSubmit()">
          <div class="row g-3">
               <div class="col-md-6">
                    <div class="form-floating">
                         <input formControlName="fecRecNotif" class="form-control"
                              id="fecRecNotifi" max="2099-12-31" min="2023-01-01"
                              type="date" placeholder=" "
                              [class.is-invalid]="fecRecNotifInvalid"
                              [attr.aria-invalid]="fecRecNotifInvalid || null"
                              [attr.aria-describedby]="fecRecNotifInvalid ? 'fecRecNotifi-err' : null">
                         <label class="required-field" for="fecRecNotifi">Fecha de recepción</label>
                    </div>
                    <div *ngIf="fecRecNotifInvalid" id="fecRecNotifi-err" class="invalid-feedback d-block" role="alert">
                         La fecha de recepción es obligatoria
                    </div>
               </div>
               <div class="col-md-6">
                    <div class="form-floating">
                         <select formControlName="receptor"
                              class="form-select"
                              [class.form-select--placeholder]="!form.controls.receptor.value"
                              [class.is-invalid]="receptorInvalid"
                              [attr.aria-invalid]="receptorInvalid || null"
                              [attr.aria-describedby]="receptorInvalid ? 'receptor-err' : null"
                              id="receptor">
                              <option [ngValue]="null" disabled>Seleccione receptor</option>
                              <option
                                   *ngFor="let receptornotifislistar of notif.receptornotifilistar; trackBy: trackByReceptor"
                                   [ngValue]="receptornotifislistar.receptor">
                                   {{ receptornotifislistar.descripcion }}
                              </option>
                         </select>
                         <label class="required-field" for="receptor">Receptor</label>
                    </div>
                    <div *ngIf="receptorInvalid" id="receptor-err" class="invalid-feedback d-block" role="alert">
                         Debe seleccionar un receptor
                    </div>
               </div>
          </div>
     </form>
     <div modalFooter class="modal-footer__actions">
          <button type="button" class="btn-iflow modal-footer__btn btn-iflow--secondary"
               (click)="handleCancelar()">Cancelar</button>
          <button type="submit" class="btn-iflow modal-footer__btn btn-iflow--primary"
               form="formRecepNotifi">Guardar</button>
     </div>
</app-modal-shell>

<app-modal-shell
     modalId="GenerarSalidaModal"
     title="Generar Salida"
     titleId="GenerarSalidaModalLabel"
     modalClass="iflow-modal iflow-modal--fit exp-generar-salida-modal"
     dialogClass="modal-lg"
     [staticBackdrop]="true"
     [dismissOnClose]="false"
     (closed)="ops.limpiarFormularioGenerarSalida(edita)">
     <form modalBody id="formGenerarSalida" (ngSubmit)="ops.validateAndPrepararCrearGenerarSalida($event, edita)" novalidate>
          <div class="row g-3">
               <div class="col-md-4">
                    <div class="form-floating">
                         <select [(ngModel)]="edita.creargenerarsalida.codTema"
                              (ngModelChange)="ops.onTemaDocumentoChange(edita)"
                              class="form-select"
                              [class.form-select--placeholder]="!edita.creargenerarsalida.codTema"
                              id="ctema1" name="ctema1">
                              <option value="" disabled>Seleccione código</option>
                              <option
                                   *ngFor="let temasdocumentolistar of edita.temadocumentolistar; trackBy: trackByCodTema"
                                   [ngValue]="temasdocumentolistar.codTema">
                                   {{ temasdocumentolistar.codTema }}{{ temasdocumentolistar.desTema ? ' — ' + temasdocumentolistar.desTema : '' }}
                              </option>
                         </select>
                         <label for="ctema1">Código tema</label>
                    </div>
               </div>
               <div class="col-md-8">
                    <div class="form-floating">
                         <input [(ngModel)]="edita.creargenerarsalida.extracto" class="form-control"
                              id="TextareaGSalida" name="extracto" required placeholder=" ">
                         <label class="required-field" for="TextareaGSalida">Extracto</label>
                         <div class="invalid-feedback">Indique el extracto.</div>
                    </div>
               </div>
               <div class="col-12">
                    <div class="form-floating">
                         <input [(ngModel)]="edita.creargenerarsalida.observaciones" class="form-control"
                              id="obsGSalida" name="observaciones" type="text" placeholder=" ">
                         <label for="obsGSalida">Observaciones</label>
                    </div>
               </div>
          </div>
     </form>
     <div modalFooter class="modal-footer__actions">
          <button type="button" class="btn-iflow modal-footer__btn btn-iflow--secondary"
               (click)="ops.clickAtrasGenerarSalida(edita)">Cancelar</button>
          <button type="submit" class="btn-iflow modal-footer__btn btn-iflow--primary"
               form="formGenerarSalida">Guardar</button>
     </div>
</app-modal-shell>

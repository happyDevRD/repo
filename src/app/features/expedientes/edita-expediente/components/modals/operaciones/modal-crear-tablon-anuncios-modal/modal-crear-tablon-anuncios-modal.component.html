<app-modal-shell
     modalId="crearTablonAnunciosModal"
     title="Nuevo Tablón de anuncios"
     titleId="crearTablonAnunciosModalLabel"
     modalClass="iflow-modal iflow-modal--fit exp-tablon-anuncios-modal"
     dialogClass="modal-lg"
     [dismissOnClose]="false"
     (closed)="edita.cerrarModal('crearTablonAnunciosModal')">
     <form modalBody id="formTablonAnuncios" (ngSubmit)="tareas.crearTablonAnuncio(edita)">
          <div class="form-floating mb-3">
               <input [(ngModel)]="edita.creartablonanuncio.desAnunc" class="form-control"
                    id="desAnuncTablon" name="desAnunc" type="text" placeholder=" ">
               <label class="required-field" for="desAnuncTablon">Descripción</label>
          </div>
          <div class="row g-3">
               <div class="col-md-4">
                    <div class="form-floating">
                         <select [(ngModel)]="edita.creartablonanuncio.tipAnunc"
                              class="form-select"
                              [class.form-select--placeholder]="edita.creartablonanuncio.tipAnunc == null"
                              id="tipAnunc" name="tipAnunc" required>
                              <option [ngValue]="null" disabled>Seleccione tipo</option>
                              <option [ngValue]="0">Edicto</option>
                              <option [ngValue]="1">Anuncio</option>
                         </select>
                         <label class="required-field" for="tipAnunc">Tipo de anuncio</label>
                    </div>
               </div>
               <div class="col-md-4">
                    <div class="form-floating">
                         <input [(ngModel)]="edita.creartablonanuncio.fecDesde" class="form-control"
                              id="fecDesdeTablon" max="2099-12-31" min="2023-01-01" name="fecDesde"
                              type="date" placeholder=" ">
                         <label for="fecDesdeTablon">Desde</label>
                    </div>
               </div>
               <div class="col-md-4">
                    <div class="form-floating">
                         <input [(ngModel)]="edita.creartablonanuncio.fecHasta" class="form-control"
                              id="fecHastaTablon" max="2099-12-31" min="2023-01-01" name="fecHasta"
                              type="date" placeholder=" ">
                         <label for="fecHastaTablon">Hasta</label>
                    </div>
               </div>
          </div>
     </form>
     <div modalFooter class="modal-footer__actions">
          <button type="button" class="btn-iflow modal-footer__btn btn-iflow--secondary"
               (click)="edita.cerrarModal('crearTablonAnunciosModal')">Cancelar</button>
          <button type="submit" class="btn-iflow modal-footer__btn btn-iflow--primary"
               form="formTablonAnuncios">Guardar</button>
     </div>
</app-modal-shell>

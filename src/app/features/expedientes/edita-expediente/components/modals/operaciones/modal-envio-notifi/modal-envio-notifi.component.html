<app-modal-shell
     modalId="EnvioNotifi"
     title="Enviar Notificación"
     titleId="EnvioNotifiLabel"
     modalClass="iflow-modal iflow-modal--fit exp-notifi-accion-modal"
     dialogClass="modal-lg"
     [staticBackdrop]="true"
     [keyboard]="false"
     [dismissOnClose]="false"
     (closed)="edita.cerrarModal('EnvioNotifi')">
     <form modalBody id="formEnvioNotifi" (ngSubmit)="notif.enviarNotificacion()">
          <div class="form-floating">
               <input [(ngModel)]="notif.creanotificacion.fecEnvio" class="form-control"
                    id="fecEnvioNotifi" max="2099-12-31" min="2023-01-01" name="fecEnvio"
                    type="date" placeholder=" ">
               <label class="required-field" for="fecEnvioNotifi">Fecha de envío</label>
          </div>
     </form>
     <div modalFooter class="modal-footer__actions">
          <button type="button" class="btn-iflow modal-footer__btn btn-iflow--secondary"
               (click)="edita.cerrarModal('EnvioNotifi')">Cancelar</button>
          <button type="submit" class="btn-iflow modal-footer__btn btn-iflow--primary"
               form="formEnvioNotifi">Guardar</button>
     </div>
</app-modal-shell>

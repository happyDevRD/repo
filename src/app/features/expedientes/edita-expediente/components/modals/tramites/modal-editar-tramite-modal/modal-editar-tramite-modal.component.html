<app-modal-shell
     modalId="editarTramiteModal"
     title="Editar Trámite"
     titleId="editarTramiteModalLabel"
     modalClass="iflow-modal iflow-modal--fit exp-tramite-modal"
     dialogClass="modal-lg"
     [dismissOnClose]="false"
     (closed)="tramites.limpiarErroresEditarTramite()">
     <form modalBody id="formEditarTramite" (ngSubmit)="handleSubmit($event)">
          <div class="row g-3 mb-3">
               <div class="col-md-6">
                    <div class="form-floating">
                         <select class="form-select"
                              [class.form-select--placeholder]="!edita.editartramiteexp.fase"
                              id="faseEdit" name="faseEdit"
                              [(ngModel)]="edita.editartramiteexp.fase" required>
                              <option value="" disabled>Seleccione fase</option>
                              <option value="INICIO">INICIO</option>
                              <option value="INSTRUCCION">INSTRUCCION</option>
                              <option value="RESOLUCION">RESOLUCION</option>
                         </select>
                         <label class="required-field" for="faseEdit">Fase</label>
                    </div>
               </div>
               <div class="col-md-6">
                    <div class="form-floating">
                         <input class="form-control" id="fecTramiteEdit" name="fecTramiteEdit" type="date"
                              [(ngModel)]="edita.editartramiteexp.fecTramite" min="2023-01-01" max="2099-12-31"
                              placeholder=" ">
                         <label for="fecTramiteEdit">Fecha trámite</label>
                    </div>
               </div>
               <div class="col-12">
                    <div class="form-floating">
                         <textarea class="form-control exp-tramite-modal__descripcion" id="descripcionEdit" name="descripcionEdit" rows="4"
                              [(ngModel)]="edita.editartramiteexp.descripcion" required minlength="1" maxlength="500"
                              placeholder=" "></textarea>
                         <label class="required-field" for="descripcionEdit">Descripción</label>
                    </div>
               </div>
          </div>
     </form>
     <div modalFooter class="modal-footer__actions">
          <button type="button" class="btn-iflow modal-footer__btn btn-iflow--secondary"
               (click)="tramites.limpiarErroresEditarTramite(); edita.cerrarModal('editarTramiteModal')">Cancelar</button>
          <button type="submit" class="btn-iflow modal-footer__btn btn-iflow--primary"
               form="formEditarTramite">Guardar</button>
     </div>
</app-modal-shell>

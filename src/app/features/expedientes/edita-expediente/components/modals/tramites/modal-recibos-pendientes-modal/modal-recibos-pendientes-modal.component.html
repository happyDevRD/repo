<app-modal-shell
     modalId="recibosPendientesModal"
     title="Recibos Pendientes de Pago"
     titleId="recibosPendientesModalLabel"
     modalClass="iflow-modal iflow-modal--fit exp-recibos-pendientes-modal"
     dialogClass="modal-xl"
     bodyClass="position-relative"
     [dismissOnClose]="false"
     (closed)="edita.cerrarModal('recibosPendientesModal')">
     <div modalBody>
          <div *ngIf="tareas.cargando" class="spinner-overlay">
               <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Cargando...</span>
               </div>
          </div>
          <app-iflow-grid #gridRecibos [source]="tareas.dataAdapter"
               [columns]="tareas.columnsRecibos" [localization]="edita.localizationObject"
               [height]="360">
          </app-iflow-grid>
     </div>
     <div modalFooter class="modal-footer__actions">
          <button type="button" class="btn-iflow modal-footer__btn btn-iflow--secondary"
               (click)="edita.cerrarModal('recibosPendientesModal')">Cerrar</button>
     </div>
</app-modal-shell>

<app-modal-shell
     modalId="GenerarPropuestaResolucionModal"
     title="Generar Propuesta de Resolución"
     titleId="GenerarPropuestaResolucionModalLabel"
     modalClass="iflow-modal iflow-modal--fit exp-propuesta-resolucion-modal"
     dialogClass="modal-lg"
     [staticBackdrop]="true"
     [dismissOnClose]="false"
     (closed)="ops.limpiarFormularioBolsa(edita)">
     <form modalBody id="formPropuestaResolucion" (ngSubmit)="ops.crearInsertaBolsa(edita)">
          <div class="row g-3">
               <div class="col-md-4">
                    <div class="form-floating">
                         <input [(ngModel)]="edita.insertabolsacrear.fecAlta" class="form-control"
                              id="fecAltaBolsa" max="2099-12-31" min="2023-01-01" name="fecAlta"
                              required type="date" placeholder=" ">
                         <label class="required-field" for="fecAltaBolsa">Fecha alta</label>
                    </div>
               </div>
               <div class="col-md-4">
                    <div class="form-floating">
                         <input [(ngModel)]="edita.insertabolsacrear.fecPrefe" class="form-control"
                              id="fecPrefeBolsa" max="2099-12-31" min="2023-01-01" name="fecPrefe"
                              required type="date" placeholder=" ">
                         <label class="required-field" for="fecPrefeBolsa">Fecha preferente</label>
                    </div>
               </div>
               <div class="col-md-4">
                    <div class="form-floating">
                         <input [(ngModel)]="edita.insertabolsacrear.fecMaxResol" class="form-control"
                              id="fecMaxResolBolsa" max="2099-12-31" min="2023-01-01" name="fecMaxResol"
                              required type="date" placeholder=" ">
                         <label class="required-field" for="fecMaxResolBolsa">Fecha máx. resolución</label>
                    </div>
               </div>
               <div class="col-md-6">
                    <div class="form-floating">
                         <input [(ngModel)]="edita.insertabolsacrear.extracto" class="form-control"
                              id="extractoBolsa" name="extracto" placeholder=" ">
                         <label for="extractoBolsa">Extracto</label>
                    </div>
               </div>
               <div class="col-md-6">
                    <div class="form-floating">
                         <input [(ngModel)]="edita.insertabolsacrear.dictamen" class="form-control"
                              id="dictamenBolsa" name="dictamen" placeholder=" ">
                         <label for="dictamenBolsa">Dictamen</label>
                    </div>
               </div>
               <div class="col-12">
                    <div class="form-floating">
                         <input [(ngModel)]="edita.insertabolsacrear.observaciones" class="form-control"
                              id="observaBolsa" name="observa" type="text" placeholder=" ">
                         <label for="observaBolsa">Observaciones</label>
                    </div>
               </div>
               <div class="col-md-6">
                    <div class="form-floating">
                         <input [(ngModel)]="edita.insertabolsacrear.expMotiv" class="form-control"
                              id="mexpeBolsa" name="mexpe" type="text" placeholder=" ">
                         <label for="mexpeBolsa">Exposición motivo</label>
                    </div>
               </div>
               <div class="col-md-6">
                    <div class="form-floating">
                         <select [(ngModel)]="edita.insertabolsacrear.prioridad"
                              class="form-select"
                              [class.form-select--placeholder]="edita.insertabolsacrear.prioridad === '' || edita.insertabolsacrear.prioridad == null"
                              id="prioridadBolsa" name="prioridad" required>
                              <option value="" disabled>Seleccione prioridad</option>
                              <option value="0">BAJA</option>
                              <option value="1">MEDIA</option>
                              <option value="2">ALTA</option>
                              <option value="3">MUY ALTA</option>
                         </select>
                         <label class="required-field" for="prioridadBolsa">Prioridad</label>
                    </div>
               </div>
               <div class="col-md-6">
                    <div class="form-floating">
                         <select [(ngModel)]="edita.insertabolsacrear.tipSesion"
                              class="form-select"
                              [class.form-select--placeholder]="edita.insertabolsacrear.tipSesion == null"
                              id="tipSesionBolsa" name="tipSesion" required>
                              <option [ngValue]="null" disabled>Seleccione tipo sesión</option>
                              <option [ngValue]="0">PLENO</option>
                              <option [ngValue]="1">JUNTA_GOBIERNO</option>
                              <option [ngValue]="2">COMISION_INFORMATIVA</option>
                              <option [ngValue]="3">NO APARECE</option>
                              <option [ngValue]="4">PLENO Y COMISION INFORMATIVA</option>
                         </select>
                         <label class="required-field" for="tipSesionBolsa">Tipo sesión</label>
                    </div>
               </div>
               <div class="col-md-6">
                    <div class="form-floating">
                         <select [(ngModel)]="edita.insertabolsacrear.tipPunto"
                              class="form-select"
                              [class.form-select--placeholder]="edita.insertabolsacrear.tipPunto == null"
                              id="tipPuntoBolsa" name="tipPunto" required>
                              <option [ngValue]="null" disabled>Seleccione tipo punto</option>
                              <option [ngValue]="0">PROPUESTA</option>
                              <option [ngValue]="1">RUEGOS Y PREGUNTAS</option>
                         </select>
                         <label class="required-field" for="tipPuntoBolsa">Tipo punto</label>
                    </div>
               </div>
          </div>
     </form>
     <div modalFooter class="modal-footer__actions">
          <button type="button" class="btn-iflow modal-footer__btn btn-iflow--secondary"
               (click)="ops.clickAtrasBolsaCrear(edita); edita.cerrarModal('GenerarPropuestaResolucionModal')">
               Cancelar
          </button>
          <button type="submit" class="btn-iflow modal-footer__btn btn-iflow--primary"
               form="formPropuestaResolucion">Guardar</button>
     </div>
</app-modal-shell>

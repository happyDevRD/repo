                    </div>
               </div>
               <div class="col-sm-6">

                                        listastareaprocedi.descripcion }}</p>

                         <br>
                    </div>
               </div>

               <div class="col-sm-6">
                    <div class="form-floating">
                         <input #fileInput (change)="edita.upload($event,edita.idTramite)"
                              [(ngModel)]="edita.tareatramiteexpedienteeditar.archivo" accept=".pdf"
                              class="form-control" id="formFile" name="doc" type="file" required>
                         <label for="doc">Seleccione Documento *</label>
                         <br>
                    </div>
               </div>

               <div class="col-sm-6">
                    <div class="form-floating">
                         <input [value]="edita.nombreArchivoTarea" class="form-control" disabled id="descripcion"
                              name="descripcion" type="text" placeholder=" ">

                         <br>
                    </div>
               </div>
          </div>


          <div class="row">

               </div>
               <div class="col-6">

                              [value]="edita.DocumentacionTarea" class="form-select " id="documentacion"
                              name="documentacion" required>

          </div>
     </form>
</app-modal-shell>

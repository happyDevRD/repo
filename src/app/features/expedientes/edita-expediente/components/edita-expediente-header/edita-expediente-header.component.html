<!-- Cabecera de página: título + acción primaria (como solicitudes) -->
<header
  *ngIf="botonVerNotifi && vertramite"
  class="edita-page-head d-flex flex-wrap align-items-end justify-content-between gap-3 mb-3 pb-3 border-bottom"
>
  <div>
    <p class="text-uppercase small fw-semibold text-secondary mb-1" style="letter-spacing:.06em">Trámite</p>
    <h2 class="h4 fw-bold mb-0">Listado de Trámites</h2>
    <p class="small text-secondary mb-0 mt-1">
      Clic para ver tareas · Doble clic para editar
    </p>
  </div>
  <div class="d-flex flex-wrap gap-2 align-items-center">
    <button
      type="button"
      class="btn-iflow btn-iflow--primary"
      title="Nuevo Trámite"
      (click)="handleNuevoTramite()"
    >
      <i class="bi bi-plus-lg" aria-hidden="true"></i> Nuevo trámite
    </button>
    <button
      type="button"
      class="btn-iflow btn-iflow--secondary"
      title="Volver"
      (click)="handleVolverListadoExpedientes()"
    >
      <i class="bi bi-arrow-left" aria-hidden="true"></i> Volver
    </button>
  </div>
</header>

<section *ngIf="botonVerNotifi && vertramite" class="edita-toolbar" aria-label="Acciones de tramitación">
  <div class="edita-toolbar__top">
    <ul class="nav nav-tabs expediente-flujo-tabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button type="button"
                class="nav-link"
                [class.active]="pestanaFlujo === 'tramitacion'"
                (click)="handlePestanaFlujo('tramitacion')"
                role="tab"
                [attr.aria-selected]="pestanaFlujo === 'tramitacion'">
          Tramitación
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button type="button"
                class="nav-link"
                [class.active]="pestanaFlujo === 'inside'"
                (click)="handlePestanaFlujo('inside')"
                role="tab"
                [attr.aria-selected]="pestanaFlujo === 'inside'">
          INSIDE
          <span *ngIf="insideDryRun" class="badge bg-info text-dark ms-1">sim.</span>
        </button>
      </li>
    </ul>
    <div class="edita-toolbar__meta">
      <span class="expediente-numero">{{ expedienteEjercicio }}/{{ expedienteNumero }}</span>
      <span *ngIf="insideUltimoEnvio?.estadoEnvio === 'PENDIENTE'" class="badge bg-warning text-dark">pendiente</span>
      <span *ngIf="insideUltimoEnvio?.estadoEnvio === 'ENVIADO' || insideUltimoEnvio?.estadoEnvio === 'SIMULADO'"
            class="badge bg-success">
        {{ insideUltimoEnvio?.estadoEnvio === 'SIMULADO' ? 'simulado' : 'enviado' }}
      </span>
      <span *ngIf="insideUltimoEnvio?.estadoEnvio === 'ERROR'" class="badge bg-danger">error</span>
    </div>
  </div>

  <nav class="expediente-acciones" aria-label="Barra de acciones">
    <div class="expediente-acciones__fila" *ngIf="pestanaFlujo === 'tramitacion'" role="tabpanel">
      <button type="button"
              class="btn-iflow btn-iflow--primary btn-iflow--sm"
              title="Notificaciones"
              (click)="handleVerNotificaciones()">
        <i class="bi bi-bell" aria-hidden="true"></i> Notificaciones
      </button>
      <button type="button"
              class="btn-iflow btn-iflow--secondary btn-iflow--sm"
              title="Tramitadores"
              (click)="handleVeotramitadores()">
        <i class="bi bi-people" aria-hidden="true"></i> Tramitadores
      </button>
    </div>

    <div class="expediente-acciones__fila" *ngIf="pestanaFlujo === 'inside'" role="tabpanel">
      <button type="button"
              class="btn-iflow btn-iflow--secondary btn-iflow--sm"
              title="Historial de envíos INSIDE"
              [disabled]="insideEnviando"
              (click)="handleVerHistorialEnviosInside()">
        <i class="bi bi-clock-history" aria-hidden="true"></i> Historial
      </button>
      <button type="button"
              class="btn-iflow btn-iflow--secondary btn-iflow--sm"
              title="Validar expediente"
              [disabled]="insideEnviando"
              (click)="handleValidarExpedienteInside()">
        <i class="bi bi-shield-check" aria-hidden="true"></i> Validar
      </button>
      <button type="button"
              class="btn-iflow btn-iflow--primary btn-iflow--sm"
              title="INSIDE Expediente"
              [disabled]="insideEnviando"
              (click)="handleEnviarExpedienteInside()">
        <i class="bi bi-cloud-upload" aria-hidden="true"></i> INSIDE Expediente
      </button>
      <button type="button"
              class="btn-iflow btn-iflow--secondary btn-iflow--sm"
              title="Alta XML Expediente"
              [disabled]="insideEnviando"
              (click)="handleAltaExpedienteEniXmlInside()">
        <i class="bi bi-file-earmark-code" aria-hidden="true"></i> Alta XML
      </button>
      <button type="button"
              class="btn-iflow btn-iflow--secondary btn-iflow--sm"
              title="INSIDE Documentos"
              [disabled]="insideEnviando"
              (click)="handleEnviarDocumentosInside()">
        <i class="bi bi-files" aria-hidden="true"></i> Documentos
      </button>
      <button type="button"
              class="btn-iflow btn-iflow--secondary btn-iflow--sm"
              title="Remisión a Justicia"
              [disabled]="insideEnviando"
              (click)="handleAbrirModalRemisionJusticia()">
        <i class="bi bi-bank" aria-hidden="true"></i> Remisión Justicia
      </button>
    </div>
  </nav>
</section>

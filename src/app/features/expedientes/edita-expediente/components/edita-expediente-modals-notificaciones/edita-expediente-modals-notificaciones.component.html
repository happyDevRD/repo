<!-- notifi-old-devolver -->

        <!-- Modal Devolver Notificación (antiguo) -->
    <app-modal-shell
      modalId="DevolverNotifiOLD"
      title="Devolver Notificación"
      titleId="DevolverNotifiLabel"
      dialogClass="modal-xl"
      [staticBackdrop]="true"
      [keyboard]="false"
      [showFooter]="false"
    >
      <form modalBody (ngSubmit)="handleDevolverNotificacion()">
<div class="row g-3">

                <div class="col-sm-4"><div class="form-floating">
                  <input [(ngModel)]="creanotificacion.fecRecNotif" class="form-control" data-mdb-inline="true"
                    id="start" max="2099-12-31" min="2023-01-01" name="trip-start" type="date" value="{{ selected }}" placeholder=" ">
                  <label for="documento">Fecha de Devoluci�n</label>

                </div></div>
                <div class="col-sm-4"><div class="form-floating">
                  <select [(ngModel)]="creanotificacion.motNotif" [value]="notificacionver.motNotif"
                    class="form-select" id="desMotNotif" name="desMotNotif" required>

                    <option *ngFor="let motivosnotificacioneslistar of motivonotificacioneslistar; trackBy: trackByMotNotif"
                      name="descripcionMotivo" value={{ motivosnotificacioneslistar.motNotif }}> {{ motivosnotificacioneslistar.descripcion }}
                    </option>

                  </select>
                  <label for="desMotNotif">Motivo Notificaci�n* </label>
                </div></div>
                <div class="col-sm-4"><div class="form-floating">
                  <select [(ngModel)]="creanotificacion.notificador" class="form-select" id="notificador"
                    name="notificador" required>

                    <option *ngFor="let notificalistar of notificadorlistar; trackBy: trackByNotificador" name="notificadorNotifi"
                      value={{ notificalistar.notificador }}> {{ notificalistar.descripcion }}
                    </option>


                  </select>
                  <label for="receptor">Notificador* </label>
                </div></div>
              </div>

              <div class="modal-footer">
                <button class="btn-iflow modal-footer__btn btn-iflow--secondary" data-bs-dismiss="modal" type="button">Cancelar</button>
                <button class="btn-iflow modal-footer__btn btn-iflow--secondary" data-bs-dismiss="modal" role="button">Guardar</button>
              </div>
      </form>
    </app-modal-shell>

<div class="container my-4">
  <form (ngSubmit)="onSubmit()" novalidate>
    <fieldset>
      <legend class="mb-3">Datos de la Liquidación</legend>

      <!-- Row 1: Sujeto Pasivo y Tipo de Objeto Tributario -->
      <div class="row g-3">
        <div class="col-md-6"><div class="form-floating">
          <input type="text"
                 id="sujetoPasivo"
                 class="form-control"
                 [(ngModel)]="nombreInteresado"
                 [ngModelOptions]="{standalone: true}"
                 disabled
                 aria-describedby="sujetoPasivoHelp" placeholder=" ">
          <label for="sujetoPasivo">Sujeto Pasivo</label>
          <small id="sujetoPasivoHelp" class="visually-hidden">Información del sujeto pasivo</small>
        </div></div>

        <div class="col-md-6"><div class="form-floating">
          <input type="text" id="tipoObjTrib" class="form-control" [value]="tipoObjTribDesc" disabled placeholder=" ">
          <label for="tipoObjTrib">Tipo de Objeto Tributario</label>
        </div></div>
      </div>

      <!-- Row 2: Tipo de Liquidación y Cuota -->
      <div class="row g-3 mt-1">
        <div class="col-md-6"><div class="form-floating">
          <select id="tipLiqui" class="form-select" [(ngModel)]="liquidacion.tipLiqui" name="tipLiqui" required>
            <option [value]="1">Liquidación</option>
            <option [value]="2">Autoliquidación</option>
          </select>
          <label for="tipLiqui">Tipo de Liquidación</label>
        </div></div>
        <div class="col-md-6"><div class="form-floating">
          <input type="text"
                 id="cuota"
                 class="form-control"
                 [(ngModel)]="liquidacion.cuoLiqui"
                 name="cuota"
                 (ngModelChange)="calculaTotal()"
                 placeholder=" "
                 currencyMask [options]="currencyOptions"
                 required>
          <label for="cuota">Cuota (€)</label>
        </div></div>
      </div>

      <!-- Row 3: Porcentaje de Bonificación -->
      <div class="row g-3 mt-1">
        <div class="col-md-6">
          <label for="porBonif" class="form-label">Porcentaje de Bonificación</label>
          <div class="input-group">
            <input type="number"
                   step="0.01"
                   id="porBonif"
                   class="form-control"
                   [(ngModel)]="liquidacion.porBonif"
                   name="porBonif"
                   (ngModelChange)="calculaTotal()"
                   placeholder=" "
                   min="0"
                   max="100"
                   required>
            <span class="input-group-text">%</span>
          </div>
        </div>
      </div>

      <!-- Row 4: Sanción y Descripción Sanción -->
      <div class="row g-3 mt-1">
        <div class="col-md-6"><div class="form-floating">
          <input type="text"
                 id="sancion"
                 class="form-control"
                 [(ngModel)]="liquidacion.impSanci"
                 name="sancion"
                 (ngModelChange)="calculaTotal()"
                 placeholder=" "
                 currencyMask [options]="currencyOptions"
                 required>
          <label for="sancion">Sanción (€)</label>
        </div></div>
        <div class="col-md-6"><div class="form-floating">
          <input type="text" id="desSanci" class="form-control" [(ngModel)]="liquidacion.desSanci" name="desSanci" maxlength="50" placeholder=" ">
          <label for="desSanci">Descripción Sanción</label>
        </div></div>
      </div>

      <!-- Row 5: Demora y Descripción Demora -->
      <div class="row g-3 mt-1">
        <div class="col-md-6"><div class="form-floating">
          <input type="text"
                 id="demora"
                 class="form-control"
                 [(ngModel)]="liquidacion.intDemor"
                 name="demora"
                 (ngModelChange)="calculaTotal()"
                 placeholder=" "
                 currencyMask [options]="currencyOptions"
                 required>
          <label for="demora">Demora (€)</label>
        </div></div>
        <div class="col-md-6"><div class="form-floating">
          <input type="text" id="desIntDemor" class="form-control" [(ngModel)]="liquidacion.desIntDemor" name="desIntDemor" maxlength="50" placeholder=" ">
          <label for="desIntDemor">Descripción Demora</label>
        </div></div>
      </div>

      <!-- Row 6: Recargo y Descripción Recargo -->
      <div class="row g-3 mt-1">
        <div class="col-md-6"><div class="form-floating">
          <input type="text"
                 id="recargo"
                 class="form-control"
                 [(ngModel)]="liquidacion.impVario"
                 name="recargo"
                 (ngModelChange)="calculaTotal()"
                 placeholder=" "
                 currencyMask [options]="currencyOptions"
                 required>
          <label for="recargo">Recargo (€)</label>
        </div></div>
        <div class="col-md-6"><div class="form-floating">
          <input type="text" id="desRecargo" class="form-control" [(ngModel)]="liquidacion.desVario" name="desRecargo" maxlength="50" placeholder=" ">
          <label for="desRecargo">Descripción Recargo</label>
        </div></div>
      </div>

      <!-- Row 7: Observaciones y Total Liquidación -->
      <div class="row g-3 mt-1">
        <div class="col-md-6"><div class="form-floating">
          <input type="text" id="observaciones" class="form-control" [(ngModel)]="liquidacion.observaciones" name="observaciones" maxlength="50" placeholder=" ">
          <label for="observaciones">Observaciones</label>
        </div></div>
        <div class="col-md-6"><div class="form-floating">
          <input type="text"
                 id="totalLiquidacion"
                 class="form-control"
                 [(ngModel)]="liquidacion.totLiqui"
                 name="totalLiquidacion"
                 placeholder=" "
                 currencyMask [options]="currencyOptions"
                 readonly>
          <label for="totalLiquidacion">Total Liquidación (€)</label>
        </div></div>
      </div>

      <!-- Botón de envío -->
      <div class="mt-3">
        <button type="submit" class="btn-iflow btn-iflow--primary btn-iflow--block">Generar Liquidación</button>
      </div>
    </fieldset>
  </form>
</div>

<app-shell contentId="hanging-icons">
      <section class="dashboard">
        <header class="dashboard__header">
          <div class="dashboard__header-text">
            <p class="dashboard__eyebrow">Panel principal</p>
            <h2 class="dashboard__title">Tus consultas pendientes</h2>
          </div>
          <div class="dashboard__total" [class.dashboard__total--loading]="isLoadingSummary">
            <span class="dashboard__total-value" *ngIf="!isLoadingSummary">{{ totalPendientes }}</span>
            <span class="dashboard__total-skeleton" *ngIf="isLoadingSummary" aria-hidden="true"></span>
            <span class="dashboard__total-label">en total</span>
          </div>
        </header>

        <div class="dashboard__grid">
          <article *ngFor="let card of dashboardCards"
                   class="dashboard-tile"
                   [class.dashboard-tile--active]="(getCardCount(card.countKey) ?? 0) > 0">
            <div class="dashboard-tile__content">
              <div class="dashboard-tile__icon-wrap" aria-hidden="true">
                <img [src]="card.icon" alt="" class="dashboard-tile__icon">
              </div>
              <div class="dashboard-tile__body">
                <div class="dashboard-tile__row">
                  <h3 class="dashboard-tile__title">{{ card.title }}</h3>
                  <span class="dashboard-tile__count"
                        *ngIf="!isLoadingSummary && getCardCount(card.countKey) !== null"
                        [class.dashboard-tile__count--pending]="getCardCount(card.countKey)! > 0">
                    {{ getCardCount(card.countKey) }}
                  </span>
                  <span class="dashboard-tile__count dashboard-tile__count--loading"
                        *ngIf="isLoadingSummary"
                        aria-hidden="true"></span>
                </div>
                <p class="dashboard-tile__desc">{{ card.description }}</p>
              </div>
            </div>
            <button type="button"
                    class="btn-iflow btn-iflow--secondary btn-iflow--block"
                    (click)="runCardAction(card.id)"
                    [disabled]="isCardLoading(card.id)">
              <span *ngIf="!isCardLoading(card.id)">Consultar</span>
              <span *ngIf="isCardLoading(card.id)" class="dashboard-tile__loading">
                <span class="btn-iflow__spinner dashboard-tile__spinner"></span>
                Cargando...
              </span>
            </button>
          </article>
        </div>
      </section>

      <app-dashboard-modals-host></app-dashboard-modals-host>
</app-shell>

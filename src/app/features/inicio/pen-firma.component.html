<app-shell>
  <app-menu-inicio></app-menu-inicio>
  <div class="page-panel">
    <header class="d-flex flex-wrap align-items-end justify-content-between gap-3 mb-3 pb-3 border-bottom">
      <div>
        <p class="text-uppercase small fw-semibold text-secondary mb-1" style="letter-spacing:.06em">Inicio</p>
        <h2 class="h4 fw-bold mb-0">Pendientes de firma</h2>
      </div>
    </header>

    <app-data-table [items]="items" emptyMessage="No hay pendientes de firma.">
      <app-table-column header="Descripción" field="descripcion" [sortable]="true"></app-table-column>
      <app-table-column header="Departamento" field="departamento" [sortable]="true"></app-table-column>
      <app-table-column header="Código SIA" field="codsia" [sortable]="true"></app-table-column>
    </app-data-table>
  </div>
</app-shell>

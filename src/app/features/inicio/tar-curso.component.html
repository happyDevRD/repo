<app-shell>
<app-menu-inicio></app-menu-inicio>

      <div class="page-panel">
        <header class="d-flex flex-wrap align-items-end justify-content-between gap-3 mb-3 pb-3 border-bottom">
          <div>
            <p class="text-uppercase small fw-semibold text-secondary mb-1" style="letter-spacing:.06em">Inicio</p>
            <h2 class="h4 fw-bold mb-0">Tareas en curso</h2>
          </div>
          <div class="d-flex flex-wrap gap-2" *ngIf="numeroArchivo">
            <button type="button" class="btn-iflow btn-iflow--primary" (click)="abreArchivo()" title="Abrir archivo">
              <i class="bi bi-file-earmark-arrow-down" aria-hidden="true"></i> Abrir archivo
            </button>
          </div>
        </header>

        <app-data-table [items]="tareatramiteexpedienteusuariolistar" [loading]="cargando"
          emptyMessage="No hay tareas en curso."
          [rowClass]="rowClassFor"
          (rowClick)="pulsaAccionesTarea($event.id, $event.archivo)">
          <app-table-column header="Expediente" field="id" [sortable]="true" align="center"></app-table-column>
          <app-table-column header="Estado" align="center">
            <ng-template>—</ng-template>
          </app-table-column>
          <app-table-column header="Interesado" align="center">
            <ng-template>—</ng-template>
          </app-table-column>
          <app-table-column header="Procedimiento" align="center">
            <ng-template>—</ng-template>
          </app-table-column>
          <app-table-column header="Descripción" field="descripcion" [sortable]="true"></app-table-column>
          <app-table-column header="Fecha apertura" field="fecInicio" [sortable]="true" [filterable]="true" filterType="dateRange" align="center"></app-table-column>
          <app-table-column header="Fecha calculada" field="propuestaResolucion" [sortable]="true" align="center"></app-table-column>
          <app-table-column header="Alerta" align="center">
            <ng-template>—</ng-template>
          </app-table-column>
          <app-table-column header="Usuario" field="usuario" [sortable]="true" [filterable]="true" align="center"></app-table-column>
        </app-data-table>
      </div>
</app-shell>

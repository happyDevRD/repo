<app-modal-shell
  modalId="DevolverMensajeModal"
  title="Rechazar mensaje"
  titleId="DevolverMensajeModalLabel"
  modalClass="iflow-modal iflow-modal--fit msg-rechazar-modal"
  dialogClass="modal-lg"
  [dismissOnClose]="false"
  (closed)="handleCancelar()">
  <form modalBody id="formRechazarMensaje" (ngSubmit)="m.validateAndRechazarMensaje($event)">
    <p class="small text-secondary mb-3">
      Indica el motivo del rechazo. Esta acción no se puede deshacer.
    </p>
    <div class="form-floating">
      <textarea
        class="form-control"
        style="min-height: 7rem"
        name="descripcionRechazoMensaje"
        id="descripcionRechazoMensaje"
        [(ngModel)]="m.rechazamensaje.descripcionRechazo"
        required
        placeholder=" "
      ></textarea>
      <label class="required-field" for="descripcionRechazoMensaje">Motivo del rechazo</label>
    </div>
  </form>
  <div modalFooter class="modal-footer__actions">
    <button type="button" class="btn-iflow modal-footer__btn btn-iflow--secondary" (click)="handleCancelar()">Cancelar</button>
    <button type="submit" class="btn-iflow modal-footer__btn btn-iflow--danger"
      form="formRechazarMensaje">Rechazar</button>
  </div>
</app-modal-shell>

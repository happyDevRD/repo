<app-shell>
<div class="page-panel">
        <header class="d-flex flex-wrap align-items-end justify-content-between gap-3 mb-3 pb-3 border-bottom">
          <div>
            <p class="text-uppercase small fw-semibold text-secondary mb-1" style="letter-spacing:.06em">Procedimientos</p>
            <h2 class="h4 fw-bold mb-0">{{ titulo }}{{ procedimiento.id }}</h2>
          </div>
          <div class="d-flex flex-wrap gap-2">
            <a routerLink="/procedimientos" class="btn-iflow btn-iflow--secondary">
              <i class="bi bi-arrow-left" aria-hidden="true"></i> Volver
            </a>
          </div>
        </header>

        <form (ngSubmit)="create()" class="form-readonly">
          <div class="row g-3">
            <div class="col-md-6"><div class="form-floating">
              <input [(ngModel)]="procedimiento.descripcion" class="form-control" name="descripcion" readonly type="text" id="descripcion" placeholder=" ">
              <label for="descripcion">Descripción</label>
            </div></div>
            <div class="col-md-6"><div class="form-floating">
              <input [(ngModel)]="procedimiento.codigoSia" class="form-control" name="codigoSIA" readonly type="text" id="codigoSIA" placeholder=" ">
              <label for="codigoSIA">Código SIA</label>
            </div></div>
          </div>
        </form>
      </div>
</app-shell>

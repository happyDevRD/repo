 <div aria-labelledby="tareaProcedi-tab" class="tab-pane fade" id="tareaProcedi" role="tabpanel">
 <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
 <h5 class="section-subtitle mb-0">Procedimiento: {{ ep.procedimiento.descripcion }}</h5>
 <div class="acciones-botones-container">
 <button class="btn-iflow btn-iflow--icon" data-bs-target="#tareasModal" data-bs-toggle="modal" type="button"
 aria-label="Nueva tarea" title="Nueva Tarea">
 <i class="bi bi-plus-lg" aria-hidden="true"></i>
 </button>
 <button (click)="ep.deleteTareaProcedimiento()" *ngIf="ep.edicion==true" class="btn-iflow btn-iflow--icon"
 type="button" aria-label="Eliminar tarea" title="Eliminar tarea">
 <i class="bi bi-trash" aria-hidden="true"></i>
 </button>
 </div>
 </div>

 <div class="grid-container mb-3">
 <app-iflow-grid #grid (rowClick)="ep.envioid($event)"
 [columns]="ep.columns" [height]="332"
 [localization]="ep.localizationObject" [pagesize]="5" [source]="ep.source">
      </app-iflow-grid>
 </div>

 <div *ngIf="ep.vermenu == true" class="action-panel mb-3">
 <h6 class="section-subtitle mb-2">Acciones de permisos</h6>
 <div class="acciones-botones-container mb-3">
 <button (click)="ep.activaFormNuevoPermiso()" *ngIf="ep.botonNuevoPermiso" class="btn-iflow btn-iflow--icon"
 type="button" aria-label="Nuevo permiso de la tarea" title="Nuevo permiso de la Tarea">
 <i class="bi bi-plus-lg" aria-hidden="true"></i>
 </button>
 <button (click)="ep.deletePermisoProcedimiento()" *ngIf="ep.veoBorrarTarea" class="btn-iflow btn-iflow--icon"
 type="button" aria-label="Eliminar permiso de la tarea" title="Eliminar Permiso de la Tarea">
 <i class="bi bi-trash" aria-hidden="true"></i>
 </button>
 </div>
 <form (ngSubmit)="ep.createPermisoProcedi()" *ngIf="ep.activoFormNuevoPermiso"
 class="row row-cols-lg-auto g-3 align-items-center">
 <div class="col-sm-3">
 <div class="form-floating">
 <select [(ngModel)]="ep.creapermisoprocedi.usuario" class="form-select" id="usuarioPermisoInline"
 name="plantilladefecto">
 <option *ngFor="let procedipermisos of ep.procedipermiso; trackBy: trackByUsuario" name="usuario"
 value="{{procedipermisos.usuario}}">
 {{ procedipermisos.usuario }}
 </option>
 </select>
 <label for="usuarioPermisoInline">Usuario</label>
 </div>
 </div>
 <div class="col-auto d-flex align-items-end gap-2 pb-1">
 <button class="btn-iflow btn-iflow--primary btn-iflow--sm" role="button" type="submit">Crear</button>
 <button (click)="ep.atrasCrearPermisoProcedi()" class="btn-iflow btn-iflow--secondary btn-iflow--sm"
 type="button">
 Atrás
 </button>
 </div>
 </form>
 </div>

 <div class="row g-3 mb-3" *ngIf="ep.vermenu == true">
 <div class="col-md-6">
 <h5 *ngIf="ep.usuarioTarea!" class="section-subtitle mb-0">
 Usuario: {{ ep.usuarioTareaDescrip }}
 </h5>
 </div>
 <div class="col-md-6">
 <h5 class="section-subtitle mb-0">Permisos de la tarea</h5>
 </div>
 </div>

 <div *ngIf="ep.vermenu == true" class="grid-container mb-2" id="columnsPermi">
 <app-iflow-grid #grid (rowClick)="ep.idpermisosPermi($event)"
 [columns]="ep.columnsPermi" [localization]="ep.localizationObject" [pagesize]="5" [source]="ep.sourcePermi" id="gridPermisosTarea">
      </app-iflow-grid>
 </div>
 <p *ngIf="ep.vermenu == true" class="text-secondary small mb-3">* Pulsa sobre el usuario para ver la descripción
 </p>

 <!-- Modal tareasModal -->
<app-modal-shell
 modalId="tareasModal"
 title="Tareas"
 titleId="tareasModalLabel"
 dialogClass="modal-xl"
 [showFooter]="false"
>
 <form modalBody (ngSubmit)="ep.createTareaProcedi(ep.idProcedimiento)">
<div class="row g-3">
 <div class="col-12">
 <div class="form-floating">
 <input [(ngModel)]="ep.creatareaprocedi.descripcion" class="form-control"
 id="descripcionTareaNueva" name="descripcion" placeholder=" " type="text">
 <label for="descripcionTareaNueva">Descripción</label>
 </div>
 </div>
 <div class="col-md-6">
 <div class="form-floating">
 <select [(ngModel)]="ep.creatareaprocedi.fasetarea" class="form-select" id="faseTareaNueva"
 name="fase">
 <option value="INICIO">Inicio</option>
 <option value="INSTRUCCION">Instrucción</option>
 <option value="RESOLUCION">Resolución</option>
 </select>
 <label for="faseTareaNueva">Fase</label>
 </div>
 </div>
 <div class="col-md-6">
 <div class="form-floating">
 <select (change)="ep.peparadatosfirma(ep.creatareaprocedi.plantilladefecto)"
 [(ngModel)]="ep.creatareaprocedi.plantilladefecto" class="form-select" id="plantillaTareaNueva"
 name="plantilladefecto">
 <option value="">Sin Plantilla</option>
 <option *ngFor="let plantillatareas of ep.plantillatarea; trackBy: trackByPlantilla" value={{plantillatareas.plantilla}}>
 {{ plantillatareas.desPlant }}
 </option>
 </select>
 <label for="plantillaTareaNueva">Plantilla por defecto</label>
 </div>
 </div>
 <div class="col-md-6">
 <div class="form-floating">
 <input [(ngModel)]="ep.creatareaprocedi.plazo" class="form-control" id="plazoTareaNueva" max="365"
 min="1" name="plazo" required="required" type="number" placeholder=" ">
 <label for="plazoTareaNueva">Plazo</label>
 </div>
 </div>
 <div class="col-md-6">
 <div class="form-floating">
 <select [(ngModel)]="ep.creatareaprocedi.tipoplazo" class="form-select" id="tipoPlazoTareaNueva"
 name="tipoplazo">
 <option value="SINPLAZO">Sin plazo</option>
 <option value="DIAS">Día</option>
 <option value="SEMANAS">Semana</option>
 <option value="MESES">Mes</option>
 <option value="ANOS">Año</option>
 </select>
 <label for="tipoPlazoTareaNueva">Tipo de plazo</label>
 </div>
 </div>
 <div class="col-12">
 <div class="form-floating">
 <select [(ngModel)]="ep.creatareaprocedi.firmapordefecto" class="form-select" id="firmaTareaNueva"
 name="firmapordefecto">
 <option *ngFor="let firmaslistar of ep.firmalistar; trackBy: trackByIdProFirma" value={{firmaslistar.idProFirma}}>
 {{ firmaslistar.descripcionCircuito }}
 </option>
 </select>
 <label for="firmaTareaNueva">Firma por defecto</label>
 </div>
 </div>
 </div>
 <div class="modal-footer">
 <button class="btn-iflow btn-iflow--secondary modal-footer__btn" data-bs-dismiss="modal"
 type="button">
 Cancelar
 </button>
 <button class="btn-iflow btn-iflow--primary modal-footer__btn" data-bs-dismiss="modal"
 role="button">
 Guardar
 </button>
 </div>
 </form>
</app-modal-shell>


 <!-- Modal modifitareasModal -->

 title="Modificar Tarea"

 </div>
 <div class="row g-3">

 name="plantillaDefecto" required="required">

 name="plazo" type="number" placeholder=" ">
 <label for="plazo">Plazo</label>
 </div>
 </div>
 <div class="col-md-6">
 <div class="form-floating">
 <select [(ngModel)]="ep.editatareaprocedi.tipoPlazo" class="form-select" id="tipoPlazo"
 name="tipoPlazo">
 <option value="SINPLAZO">Sin plazo</option>
 <option value="DIAS">Día</option>
 <option value="SEMANAS">Semana</option>
 <option value="MESES">Mes</option>
 <option value="ANOS">Año</option>
 </select>
 <label for="tipoPlazo">Tipo de plazo</label>
 </div>
 </div>
 </div>
 <div class="mb-3">
 <div class="form-floating">
 <select [(ngModel)]="ep.editatareaprocedi.firmaPorDefecto" class="form-select" id="firmaPorDefecto"
 name="firmaPorDefecto">
 <option value="">Sin firma</option>
 <option *ngFor="let firmaslistar of ep.firmalistar; trackBy: trackByIdProFirma" value={{firmaslistar.idProFirma}}>
 {{ firmaslistar.descripcionCircuito }}
 </option>
 </select>
 <label for="firmaPorDefecto">Firma por defecto</label>
 </div>
 </div>
 <div class="modal-footer">
 <button class="btn-iflow btn-iflow--secondary modal-footer__btn" data-bs-dismiss="modal"
 type="button">
 Cancelar
 </button>
 <button class="btn-iflow btn-iflow--primary modal-footer__btn" data-bs-dismiss="modal"
 role="button">
 Guardar
 </button>
 </div>
 </form>
</app-modal-shell>


 </div>

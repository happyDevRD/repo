<div class="page-panel procedimientos-page">
  <header class="procedimientos-header">
    <div class="procedimientos-header__text">
      <p class="procedimientos-header__eyebrow">Configuración del departamento</p>
      <h2 class="procedimientos-header__title">Procedimientos</h2>
      <p class="procedimientos-header__dept">
        <i class="bi bi-building" aria-hidden="true"></i>
        {{ p.departamento }}
      </p>
    </div>
    <button class="btn-iflow btn-iflow--primary" type="button" (click)="p.abrirNuevoProcedimientoModal()">
      <i class="bi bi-plus-lg" aria-hidden="true"></i>
      Nuevo procedimiento
    </button>
  </header>

  <app-data-table [items]="p.procedimientos" [loading]="p.cargandoProcedimientos"
    emptyMessage="No hay procedimientos configurados en este departamento."
    searchPlaceholder="Buscar por descripción, código SIA o siglas…"
    exportFileName="procedimientos"
    (rowClick)="p.abrirProcedimiento($event.id)">
    <app-table-column header="Descripción" field="descripcion" [sortable]="true"></app-table-column>
    <app-table-column header="Código SIA" field="codigoSia" [sortable]="true"></app-table-column>
    <app-table-column header="Siglas" field="siglas" [sortable]="true"></app-table-column>
    <app-table-column header="Modalidad" [sortValue]="modalidadValue" [searchValue]="modalidadValue" [sortable]="true"
      [filterable]="true">
      <ng-template let-row>{{ p.getModalidadLabelFor(row.modalidad) }}</ng-template>
    </app-table-column>
    <app-table-column header="Materia" [sortValue]="materiaValue" [searchValue]="materiaValue" [sortable]="true"
      [filterable]="true">
      <ng-template let-row>{{ p.getMateriaLabelFor(row.idMatProce) }}</ng-template>
    </app-table-column>
  </app-data-table>
</div>

<div class="tab-pane fade" id="tareaProcedi" role="tabpanel" aria-labelledby="tareaProcedi-tab">
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
    <h5 class="section-subtitle mb-0">Tareas del procedimiento</h5>
    <div class="acciones-botones-container">
      <button class="btn-iflow btn-iflow--icon" type="button" data-bs-toggle="modal" data-bs-target="#tareasModal"
        aria-label="Nueva tarea" title="Nueva tarea">
        <i class="bi bi-plus-lg" aria-hidden="true"></i>
      </button>
      <button *ngIf="fn.edicion==true" class="btn-iflow btn-iflow--icon" type="button" data-bs-toggle="modal"
        data-bs-target="#modifitareasModal" aria-label="Editar tarea" title="Editar tarea">
        <i class="bi bi-pencil" aria-hidden="true"></i>
      </button>
      <button *ngIf="fn.edicion==true" (click)="fn.vacio()" class="btn-iflow btn-iflow--icon" type="button"
        aria-label="Eliminar tarea" title="Eliminar tarea">
        <i class="bi bi-trash" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-iflow table-hover">
      <thead>
        <tr>
          <th></th>
          <th>Descripción</th>
          <th>Fase</th>
          <th>Plazo</th>
          <th>Tipo Plazo</th>

        </tr>

      </thead>
      <tbody>
        <tr *ngFor="let listatareasprocedi of fn.listatareaprocedi; trackBy: trackByTareaId">
          <td>
            <div class="form-check">
              <input class="form-check-input"
                (change)="fn.envioid(listatareasprocedi.id, listatareasprocedi.descripcion, listatareasprocedi.faseTarea, listatareasprocedi.plazo, listatareasprocedi.tipoPlazo, listatareasprocedi.plantillaDefecto)"
                type="radio" [value]="listatareasprocedi.id" name="tareaSeleccionada"
                [id]="'tarea-' + listatareasprocedi.id">
            </div>
          </td>
          <td>{{listatareasprocedi.descripcion }}</td>
          <td>{{listatareasprocedi.faseTarea }}</td>
          <td>{{listatareasprocedi.plazo }}</td>
          <td>{{listatareasprocedi.tipoPlazo }}</td>


      </tbody>
    </table>
  </div>
  <!-- <pagination-controls (pageChange)='fn.page = $event' previousLabel='Anterior' nextLabel='Siguiente'></pagination-controls>  -->

  <!-- Modal tareasModal -->
  <app-modal-shell modalId="tareasModal" title="Tareas" titleId="tareasModalLabel" dialogClass="modal-xl"
    [showFooter]="false">
    <form modalBody (ngSubmit)="fn.createTareaProcedi()">
      <div class="row g-3">
        <div class="col-12">
          <div class="form-floating">
            <input type="text" class="form-control" id="descripcionTareaNueva" name="descripcion"
              [(ngModel)]="fn.creatareaprocedi.descripcion" placeholder=" ">
            <label for="descripcionTareaNueva">Descripción</label>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-floating">
            <select class="form-select" id="faseTareaNueva" name="fase" [(ngModel)]="fn.creatareaprocedi.fasetarea">
              <option value="INICIO">Inicio</option>
              <option value="INSTRUCCION">Instrucción</option>
              <option value="RESOLUCION">Resolución</option>
            </select>
            <label for="faseTareaNueva">Fase</label>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-floating">
            <select class="form-select" id="plantillaTareaNueva" name="plantilladefecto"
              [(ngModel)]="fn.creatareaprocedi.plantilladefecto">
              <option *ngFor="let plantillatareas of fn.plantillatarea; trackBy: trackByPlantilla"
                value={{plantillatareas.plantilla}}>{{plantillatareas.desPlant}}</option>
            </select>
            <label for="plantillaTareaNueva">Plantilla por defecto</label>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-floating">
            <input type="number" class="form-control" id="plazoTareaNueva" name="plazo" min="1" max="365"
              (change)="fn.peparadatosfirma(fn.creatareaprocedi.plantilladefecto)" required
              [(ngModel)]="fn.creatareaprocedi.plazo" placeholder=" ">
            <label for="plazoTareaNueva">Plazo</label>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-floating">
            <select class="form-select" id="tipoPlazoTareaNueva" name="tipoplazo"
              [(ngModel)]="fn.creatareaprocedi.tipoplazo">
              <option value="DIAS">Día</option>
              <option value="SEMANAS">Semana</option>
              <option value="MESES">Mes</option>
              <option value="ANOS">Año</option>
            </select>
            <label for="tipoPlazoTareaNueva">Tipo de plazo</label>
          </div>
        </div>
        <div class="col-12">
          <div class="form-floating">
            <select class="form-select" id="firmaTareaNueva" name="firmapordefecto"
              [(ngModel)]="fn.creatareaprocedi.firmapordefecto">
              <option *ngFor="let firmaslistar of fn.firmalistar; trackBy: trackByIdProFirma"
                value={{firmaslistar.idProFirma}}>{{firmaslistar.descripcionCircuito}}</option>
            </select>
            <label for="firmaTareaNueva">Firma por defecto</label>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-iflow btn-iflow--secondary modal-footer__btn"
          data-bs-dismiss="modal">Cancelar</button>
        <button class="btn-iflow btn-iflow--primary modal-footer__btn" type="submit">Crear</button>
      </div>
    </form>
  </app-modal-shell>


  <!-- Modal modifitareasModal -->
  <app-modal-shell modalId="modifitareasModal" title="Modificar Tarea" titleId="modifitareasModalLabel"
    dialogClass="modal-xl" [showFooter]="false">
    <form modalBody (ngSubmit)="fn.editaTareaProcedim()">
      <div class="row g-3">
        <div class="col-12">
          <div class="form-floating">
            <input type="text" class="form-control" id="descripcionTareaEditar" name="descripcionEditar"
              [(ngModel)]="fn.editatareaprocedi.descripcion" placeholder=" ">
            <label for="descripcionTareaEditar">Descripción</label>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-floating">
            <select class="form-select" id="faseTareaEditar" name="faseEditar"
              [(ngModel)]="fn.editatareaprocedi.faseTarea">
              <option value="INICIO">Inicio</option>
              <option value="INSTRUCCION">Instrucción</option>
              <option value="RESOLUCION">Resolución</option>
            </select>
            <label for="faseTareaEditar">Fase</label>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-floating">
            <select class="form-select" id="plantillaTareaEditar" name="plantillaEditar"
              [(ngModel)]="fn.editatareaprocedi.plantillaDefecto"
              (change)="fn.peparadatosfirma(fn.editatareaprocedi.plantillaDefecto)">
              <option value="">Sin plantilla</option>
              <option *ngFor="let plantillatareas of fn.plantillatarea; trackBy: trackByPlantilla"
                [value]="plantillatareas.plantilla">{{ plantillatareas.desPlant }}</option>
            </select>
            <label for="plantillaTareaEditar">Plantilla por defecto</label>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-floating">
            <input type="number" class="form-control" id="plazoTareaEditar" name="plazoEditar" min="1" max="365"
              [(ngModel)]="fn.editatareaprocedi.plazo" placeholder=" ">
            <label for="plazoTareaEditar">Plazo</label>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-floating">
            <select class="form-select" id="tipoPlazoTareaEditar" name="tipoPlazoEditar"
              [(ngModel)]="fn.editatareaprocedi.tipoPlazo">
              <option value="SINPLAZO">Sin plazo</option>
              <option value="DIAS">Día</option>
              <option value="SEMANAS">Semana</option>
              <option value="MESES">Mes</option>
              <option value="ANOS">Año</option>
            </select>
            <label for="tipoPlazoTareaEditar">Tipo de plazo</label>
          </div>
        </div>
        <div class="col-12">
          <div class="form-floating">
            <select class="form-select" id="firmaTareaEditar" name="firmaEditar"
              [(ngModel)]="fn.editatareaprocedi.firmaPorDefecto">
              <option [ngValue]="null">Sin firma</option>
              <option *ngFor="let firmaslistar of fn.firmalistar; trackBy: trackByIdProFirma"
                [ngValue]="firmaslistar.idProFirma">{{ firmaslistar.descripcionCircuito }}</option>
            </select>
            <label for="firmaTareaEditar">Firma por defecto</label>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-iflow btn-iflow--secondary modal-footer__btn"
          data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn-iflow btn-iflow--primary modal-footer__btn">Guardar</button>
      </div>
    </form>
  </app-modal-shell>


</div>


<div class="login-page">
  <header class="login-page__header">
    <img class="login-page__brand-logo" src="assets/images/greenaall_logo.png" alt="Greenall">
    <span class="login-page__product">Gestor de Expedientes iFlow</span>
  </header>

  <main class="login-page__content">
    <section class="login-hero" aria-hidden="true">
      <h1 class="login-hero__title">Gestión pública más clara y ágil</h1>
      <p class="login-hero__subtitle">
        Centraliza expedientes, solicitudes, tareas y notificaciones en un flujo único.
      </p>
    </section>

    <section class="login-card" aria-label="Acceso al sistema">
      <img class="login-card__logo" src="assets/images/iflow.png" alt="iFlow">

      <div *ngIf="!veoFormuCodigo">
        <form (ngSubmit)="login()" class="login-form">
          <h2 class="login-form__title">Accede con tu cuenta</h2>
          <p class="login-form__helper">Introduce tus credenciales para continuar.</p>

          <div class="form-floating">
            <input [(ngModel)]="usuario.usuario" type="text" class="form-control mb-3" id="floatingInput"
                   name="usuario" autocomplete="username" autofocus required>
            <label for="floatingInput">Usuario</label>
          </div>
          <div class="form-floating">
            <input [(ngModel)]="usuario.password" type="password" class="form-control" id="floatingPassword"
                   name="password" autocomplete="current-password" required>
            <label for="floatingPassword">Contraseña</label>
          </div>

          <button class="btn-iflow btn-iflow--primary btn-iflow--block btn-login" type="submit">{{titulo}}</button>
          <div *ngIf="spinner" class="spinner-border text-primary login-form__spinner" role="status"></div>
        </form>
      </div>

      <div *ngIf="veoFormuCodigo">
        <form (ngSubmit)="revisaCodigo(codigo)" class="login-form">
          <h2 class="login-form__title">Verificación adicional</h2>
          <p class="login-form__helper">Introduce el código enviado a tu correo.</p>

          <div class="form-floating">
            <input [(ngModel)]="codigo" type="text" class="form-control mb-3" id="floatingCodigo" name="codigointro"
                   autofocus required>
            <label for="floatingCodigo">Código</label>
          </div>

          <button class="btn-iflow btn-iflow--primary btn-iflow--block btn-login" type="submit">Aceptar</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="login-page__footer">
    <app-footer></app-footer>
  </footer>
</div>

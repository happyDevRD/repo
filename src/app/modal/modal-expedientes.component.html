
<!--    MODAL EDITAR -->
<div class="modal fade" id="editarModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel" >Editar Expediente : {{verexpediente.ejercicio}}/{{verexpediente.numero}}</h5>
          <button  type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form (ngSubmit)="editExpediente()">
            <!-- Row 1: Título -->
            <div class="row mb-3">
              <div class="col-12">
                <div class="form-floating">
                  <input type="text" class="form-control" id="titulo" name="titulo" 
                         [(ngModel)]="verexpediente.titulo" placeholder="Título">
                  <label for="titulo">Título</label>
                </div>
              </div>
            </div>

            <!-- Row 2: Estado, Fase, Forma Notificación, Correo -->
            <div class="row mb-3">
              <div class="col-md-3">
                <div class="form-floating">
                  <input type="text" class="form-control" id="estado" name="estado" 
                         [value]="verexpediente.estado" readonly>
                  <label for="estado">Estado</label>
                </div>
              </div>
              <div class="col-md-3">
                <div class="form-floating">
                  <input type="text" class="form-control" id="fase" name="fase" 
                         [value]="verexpediente.fase" readonly>
                  <label for="fase">Fase</label>
                </div>
              </div>
              <div class="col-md-3">
                <div class="form-floating">
                  <select class="form-select" id="formaNotificacion" name="formaNotificacion" 
                          [(ngModel)]="verexpediente.formaNotificacion">
                    <option value="Telemática">Telemática</option>
                    <option value="Presencial">Presencial</option>
                    <option value="Correo">Correo</option>
                  </select>
                  <label for="formaNotificacion">Forma Notificación</label>
                </div>
              </div>
              <div class="col-md-3">
                <div class="form-floating">
                  <input type="email" class="form-control" id="correo" name="correo" 
                         [(ngModel)]="verexpediente.email" placeholder="Correo electrónico">
                  <label for="correo">Correo electrónico</label>
                </div>
              </div>
            </div>

            <!-- Row 3: DNI, Fecha cancelación, Fecha Expediente, Representante -->
            <div class="row mb-3">
              <div class="col-md-3">
                <div class="form-floating">
                  <input type="text" class="form-control" id="dni" name="dni" 
                         [value]="verexpediente.personaEntidad[0]?.numDocum || ''" readonly>
                  <label for="dni">Interesado DNI</label>
                </div>
              </div>
              <div class="col-md-3">
                <div class="form-floating">
                  <input type="date" class="form-control" id="fechaCancelacion" name="fechaCancelacion" 
                         [(ngModel)]="verexpediente.fecCancelacion">
                  <label for="fechaCancelacion">Fecha cancelación</label>
                </div>
              </div>
              <div class="col-md-3">
                <div class="form-floating">
                  <input type="date" class="form-control" id="fechaExpediente" name="fechaExpediente" 
                         [(ngModel)]="verexpediente.fecInicio">
                  <label for="fechaExpediente">Fecha Expediente</label>
                </div>
              </div>
              <div class="col-md-3">
                <div class="form-floating">
                  <input type="text" class="form-control" id="representante" name="representante" 
                         [value]="verexpediente.nomRepre || ''" readonly>
                  <label for="representante">Representante</label>
                </div>
              </div>
            </div>

            <!-- Row 4: Procedimiento, Forma Apertura -->
            <div class="row mb-3">
              <div class="col-md-6">
                <div class="form-floating">
                  <input type="text" class="form-control" id="procedimiento" name="procedimiento" 
                         [value]="verexpediente.procedimiento[0]?.descripcion || ''" readonly>
                  <label for="procedimiento">Procedimiento</label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-floating">
                  <select class="form-select" id="formaApertura" name="formaApertura" 
                          [(ngModel)]="verexpediente.formaApertura">
                    <option value="Oficio">Oficio</option>
                    <option value="Instancia">Instancia</option>
                    <option value="Telemática">Telemática</option>
                  </select>
                  <label for="formaApertura">Forma Apertura</label>
                </div>
              </div>
            </div>

            <!-- Row 5: Nombre, Apellidos -->
            <div class="row mb-3">
              <div class="col-md-6">
                <div class="form-floating">
                  <input type="text" class="form-control" id="nombre" name="nombre" 
                         [value]="verexpediente.personaEntidad[0]?.nombre || ''" readonly>
                  <label for="nombre">Nombre</label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-floating">
                  <input type="text" class="form-control" id="apellidos" name="apellidos" 
                         [value]="(verexpediente.personaEntidad[0]?.apellido1 || '') + ' ' + (verexpediente.personaEntidad[0]?.apellido2 || '')" readonly>
                  <label for="apellidos">Apellidos</label>
                </div>
              </div>
            </div>

            <!-- Row 6: Dirección -->
            <div class="row mb-3">
              <div class="col-12">
                <div class="form-floating">
                  <input type="text" class="form-control" id="direccion" name="direccion" 
                         [value]="verexpediente.personaEntidad[0]?.dirPosta || ''" readonly>
                  <label for="direccion">Dirección</label>
                </div>
              </div>
            </div>

            <!-- Row 7: Código Postal, Provincia, Municipio -->
            <div class="row mb-3">
              <div class="col-md-4">
                <div class="form-floating">
                  <input type="text" class="form-control" id="codigoPostal" name="codigoPostal" 
                         [value]="verexpediente.personaEntidad[0]?.codPosta || ''" readonly>
                  <label for="codigoPostal">Código Postal</label>
                </div>
              </div>
              <div class="col-md-4">
                <div class="form-floating">
                  <input type="text" class="form-control" id="provincia" name="provincia" 
                         [value]="verexpediente.personaEntidad[0]?.provincia || ''" readonly>
                  <label for="provincia">Provincia</label>
                </div>
              </div>
              <div class="col-md-4">
                <div class="form-floating">
                  <input type="text" class="form-control" id="municipio" name="municipio" 
                         [value]="verexpediente.personaEntidad[0]?.municipio || ''" readonly>
                  <label for="municipio">Municipio</label>
                </div>
              </div>
            </div>
            
            <div class="modal-footer"> 
              <br>
               <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Atras</button>
              <button class="btn btn-outline-primary "  data-bs-dismiss="modal" role="button">Editar</button>
             </div>
  
            
          </form>
        </div>
  
        
  
  
  
  
        
      </div>
    </div>
  </div>
  
  
  
  <!--    MODAL ASIGNAR TRAMITADOR-->
  <div class="modal fade" id="tramitadorModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">Asignar tramitador</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form>
            <div class="mb-3">
              
              <input type="text" class="form-control" id="asunto" placeholder="Asunto">
            </div>
            <div class="mb-3">
              
              <input type="text" class="form-control" id="tramitador" placeholder="Usuario tramitador">
            </div>
            <div class="mb-3">
              <input  class="form-control" data-mdb-inline="true" type="date" id="start" name="trip-start"
           value="datos"
           min="2023-01-01" max="2023-12-31">
      
            </div>
          
          <div class="modal-footer"> 
             <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Atras</button>
            <button class="btn btn-outline-primary "  data-bs-dismiss="modal" role="button">Asignar</button>
           </div>
            
  
            
          </form>
        </div>
  
        
  
  
  
  
        
      </div>
    </div>
  </div>

  <!--    MODAL VER EXPEDIENTE -->
  <div class="modal fade" id="verExpedienteModal" tabindex="-1" aria-labelledby="verExpedienteLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="verExpedienteLabel">
            Ver Expediente : {{verexpediente.ejercicio}}/{{verexpediente.numero}}
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <!-- Título -->
          <div class="row mb-3">
            <div class="col-12">
              <div class="form-floating">
                <input type="text" class="form-control" id="tituloVer" [value]="verexpediente.titulo" readonly>
                <label class="form-label form-label--floating" for="tituloVer">Título</label>
              </div>
            </div>
          </div>
          <!-- Estado, Fase, Forma Notificación, Correo -->
          <div class="row mb-3">
            <div class="col-md-3">
              <div class="form-floating">
                <input type="text" class="form-control" id="estadoVer" [value]="verexpediente.estado" readonly>
                <label class="form-label form-label--floating" for="estadoVer">Estado</label>
              </div>
            </div>
            <div class="col-md-3">
              <div class="form-floating">
                <input type="text" class="form-control" id="faseVer" [value]="verexpediente.fase" readonly>
                <label class="form-label form-label--floating" for="faseVer">Fase</label>
              </div>
            </div>
            <div class="col-md-3">
              <div class="form-floating">
                <input type="text" class="form-control" id="formaNotificacionVer" [value]="verexpediente.formaNotificacion || verexpediente.forNotifTexto" readonly>
                <label class="form-label form-label--floating" for="formaNotificacionVer">Forma Notificación</label>
              </div>
            </div>
            <div class="col-md-3">
              <div class="form-floating">
                <input type="email" class="form-control" id="correoVer" [value]="verexpediente.email" readonly>
                <label class="form-label form-label--floating" for="correoVer">Correo electrónico</label>
              </div>
            </div>
          </div>
          <!-- Interesado DNI, Fecha cancelación, Fecha Expediente, Representante -->
          <div class="row mb-3">
            <div class="col-md-3">
              <div class="form-floating">
                <input type="text" class="form-control" id="dniVer" [value]="verexpediente.personaEntidad?.numDocum || ''" readonly>
                <label class="form-label form-label--floating" for="dniVer">Interesado DNI</label>
              </div>
            </div>
            <div class="col-md-3">
              <div class="form-floating">
                <input type="text" class="form-control" id="fechaCancelacionVer" [value]="verexpediente.fecCancelacion | date:'yyyy-MM-dd'" readonly>
                <label class="form-label form-label--floating" for="fechaCancelacionVer">Fecha cancelación</label>
              </div>
            </div>
            <div class="col-md-3">
              <div class="form-floating">
                <input type="text" class="form-control" id="fechaExpedienteVer" [value]="verexpediente.fecInicio | date:'yyyy-MM-dd'" readonly>
                <label class="form-label form-label--floating" for="fechaExpedienteVer">Fecha Expediente</label>
              </div>
            </div>
            <div class="col-md-3">
              <div class="form-floating">
                <input type="text" class="form-control" id="representanteVer" [value]="verexpediente.nomRepre || ''" readonly>
                <label class="form-label form-label--floating" for="representanteVer">Representante</label>
              </div>
            </div>
          </div>
          <!-- Procedimiento, Forma Apertura -->
          <div class="row mb-3">
            <div class="col-md-6">
              <div class="form-floating">
                <input type="text" class="form-control" id="procedimientoVer" [value]="verexpediente.procedimiento?.descripcion || ''" readonly>
                <label class="form-label form-label--floating" for="procedimientoVer">Procedimiento</label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-floating">
                <input type="text" class="form-control" id="formaAperturaVer" [value]="verexpediente.formaApertura" readonly>
                <label class="form-label form-label--floating" for="formaAperturaVer">Forma Apertura</label>
              </div>
            </div>
          </div>
          <!-- Nombre, Apellidos -->
          <div class="row mb-3">
            <div class="col-md-6">
              <div class="form-floating">
                <input type="text" class="form-control" id="nombreVer" [value]="verexpediente.personaEntidad?.nombre || ''" readonly>
                <label class="form-label form-label--floating" for="nombreVer">Nombre</label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-floating">
                <input type="text" class="form-control" id="apellidosVer" [value]="(verexpediente.personaEntidad?.apellido1 || '') + ' ' + (verexpediente.personaEntidad?.apellido2 || '')" readonly>
                <label class="form-label form-label--floating" for="apellidosVer">Apellidos</label>
              </div>
            </div>
          </div>
          <!-- Dirección -->
          <div class="row mb-3">
            <div class="col-12">
              <div class="form-floating">
                <input type="text" class="form-control" id="direccionVer" [value]="verexpediente.personaEntidad?.dirPosta || ''" readonly>
                <label class="form-label form-label--floating" for="direccionVer">Dirección</label>
              </div>
            </div>
          </div>
          <!-- Código Postal, Provincia, Municipio -->
          <div class="row mb-3">
            <div class="col-md-4">
              <div class="form-floating">
                <input type="text" class="form-control" id="codigoPostalVer" [value]="verexpediente.personaEntidad?.codPosta || ''" readonly>
                <label class="form-label form-label--floating" for="codigoPostalVer">Código Postal</label>
              </div>
            </div>
            <div class="col-md-4">
              <div class="form-floating">
                <input type="text" class="form-control" id="provinciaVer" [value]="verexpediente.personaEntidad?.provincia || ''" readonly>
                <label class="form-label form-label--floating" for="provinciaVer">Provincia</label>
              </div>
            </div>
            <div class="col-md-4">
              <div class="form-floating">
                <input type="text" class="form-control" id="municipioVer" [value]="verexpediente.personaEntidad?.municipio || ''" readonly>
                <label class="form-label form-label--floating" for="municipioVer">Municipio</label>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-iflow btn-iflow--primary" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

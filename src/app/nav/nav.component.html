<div class="sidebar-overlay"
     [class.sidebar-overlay--visible]="mobileMenuOpen"
     (click)="closeMobileMenu()"
     aria-hidden="true"></div>

<aside id="sidebar"
       class="app-sidebar"
       role="navigation"
       aria-label="Menú principal"
       [class.app-sidebar--open]="mobileMenuOpen"
       [class.app-sidebar--collapsed]="collapsed">

  <button type="button"
          class="app-sidebar__collapse-btn"
          (click)="toggleCollapsed()"
          [attr.aria-expanded]="!collapsed"
          aria-label="Contraer o expandir menú">
    <i class="bi" [ngClass]="collapsed ? 'bi-chevron-right' : 'bi-chevron-left'" aria-hidden="true"></i>
  </button>

  <div class="app-sidebar__header">
    <img [src]="escudo" alt="Escudo del departamento" class="app-sidebar__logo" />
  </div>

  <nav class="app-sidebar__nav" aria-label="Secciones de la aplicación">
    <ul class="app-sidebar__list" role="list">
      <li class="app-sidebar__item" *ngFor="let link of navLinks">
        <a class="app-sidebar__link"
           [routerLink]="link.path"
           routerLinkActive="app-sidebar__link--active"
           [routerLinkActiveOptions]="{ exact: link.exact !== false }"
           [attr.title]="collapsed ? link.label : null"
           (click)="closeMobileMenu()">
          <i class="bi app-sidebar__icon" [ngClass]="link.icon" aria-hidden="true"></i>
          <span class="app-sidebar__label">{{ link.label }}</span>
          <span *ngIf="getBadgeCount(link) > 0"
                class="app-sidebar__badge"
                [attr.aria-label]="getBadgeCount(link) + ' pendientes'">
            {{ getBadgeCount(link) }}
          </span>
        </a>
      </li>
    </ul>
  </nav>

  <div class="app-sidebar__footer">
    <img *ngIf="!collapsed" src="assets/images/iflow.png" alt="iFlow" class="app-sidebar__brand" />
    <span *ngIf="!collapsed" class="app-sidebar__footer-meta">Greenaall {{ appYear }} · v{{ appVersion }}</span>
    <span *ngIf="!collapsed && userName" class="app-sidebar__footer-user">{{ userName }}</span>

    <button *ngIf="!collapsed"
            type="button"
            class="btn-iflow btn-iflow--on-dark btn-iflow--block app-sidebar__logout-btn"
            (click)="logout()">
      <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
      <span>Cerrar sesión</span>
    </button>

    <button *ngIf="collapsed"
            type="button"
            class="app-sidebar__logout-icon-btn"
            [attr.title]="'Cerrar sesión (' + userName + ')'"
            aria-label="Cerrar sesión"
            (click)="logout()">
      <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
    </button>
  </div>
</aside>

<app-shell contentId="hanging-icons">
  <app-access-denied
    *ngIf="!session.canManageExpedientes"
    title="Sin acceso a expedientes"
    message="Este usuario no tiene permisos para gestionar interesados del expediente.">
  </app-access-denied>

  <ng-container *ngIf="session.canManageExpedientes">
    <div class="page-panel">
      <div class="expediente-header-container">
        <div class="expediente-titulo-info">
          <h3 class="expediente-titulo">
            Expediente:
            <span class="expediente-numero">{{ verexpediente.ejercicio }}/{{ verexpediente.numero }}</span>
          </h3>
        </div>
        <div class="expediente-botones-navegacion">
          <button type="button" class="btn-iflow btn-iflow--secondary" (click)="volverListadoExpedientes()">
            Volver al listado
          </button>
        </div>
      </div>

      <div class="listado-titulo-container titulo-separador">
        <h2 class="listado-titulo-principal">Interesados del expediente</h2>
        <div class="titulo-botones-container">
          <button type="button" class="btn-iflow btn-iflow--icon" title="Nuevo interesado"
                  (click)="abrirModal('ninteresadoModal')">
            <i class="bi bi-plus-lg" aria-hidden="true"></i>
          </button>
          <button *ngIf="veoBorraInteresado" type="button" class="btn-iflow btn-iflow--icon" title="Borrar interesado"
                  (click)="borrarinteresados()">
            <i class="bi bi-trash" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <div class="grid-container">
        <jqxGrid class=""
                 [width]="'100%'"
                 [autoheight]="true"
                 [columnsautoresize]="true"
                 [source]="sourceInteresado"
                 [pagesize]="10"
                 [pageable]="true"
                 [altrows]="true"
                 [filterable]="true"
                 [sortable]="true"
                 (onRowclick)="clickInteresado($event)"
                 (onRowdoubleclick)="abrirModalVerInteresado($event)"
                 [columns]="columnsInteresado"
                 [localization]="localizationObject"
                 #grid>
        </jqxGrid>
      </div>
    </div>

    <!-- Modal: Nuevo interesado -->
    <div class="modal fade" id="ninteresadoModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false"
         aria-labelledby="ninteresadoModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-xl">
        <div class="modal-content">
          <div class="modal-header">
            <h4 class="modal-title" id="ninteresadoModalLabel">Nuevo interesado</h4>
            <button type="button" class="btn-close" (click)="cerrarModal('ninteresadoModal')" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <form (ngSubmit)="crearInteresado()">
              <div class="row g-3">
                <div class="col-md-4"><div class="form-floating">
                  <input type="date" class="form-control" id="fechaInicio" name="fechaInicio"
                         [(ngModel)]="crearinteresado.fechaInicio" [value]="selected" placeholder=" ">
                  <label for="fechaInicio">Fecha inicio *</label>
                </div></div>
                <div class="col-md-4"><div class="form-floating">
                  <input type="text" class="form-control" id="interesado" name="interesado"
                         [(ngModel)]="crearinteresado.usuario" (change)="solicitadni(crearinteresado.usuario)"
                         (blur)="validateField('interesado', crearinteresado.usuario)" placeholder=" ">
                  <label for="interesado">DNI interesado *</label>
                </div></div>
                <div class="col-md-4"><div class="form-floating">
                  <select class="form-select" id="fnotifi" name="fnotifi" [(ngModel)]="crearinteresado.tipForNotif"
                          (blur)="validateField('fnotifi', crearinteresado.tipForNotif)">
                    <option [ngValue]="0">Correo postal</option>
                    <option [ngValue]="1">Telemática</option>
                  </select>
                  <label for="fnotifi">Forma de notificación *</label>
                </div></div>
              </div>

              <div class="row g-3 mt-2" *ngIf="crearinteresado.tipForNotif == 1">
                <div class="col-md-6"><div class="form-floating">
                  <input type="email" class="form-control" id="email" name="email" [(ngModel)]="crearinteresado.email" placeholder=" ">
                  <label for="email">Correo electrónico</label>
                </div></div>
              </div>

              <div class="row g-3 mt-2" *ngIf="dniok">
                <div class="col-md-6"><div class="form-floating">
                  <input type="text" class="form-control" id="nombre" name="nombre" [value]="nombredni" disabled placeholder=" ">
                  <label for="nombre">Nombre</label>
                </div></div>
                <div class="col-md-6"><div class="form-floating">
                  <input type="text" class="form-control" id="apellidos" name="apellidos"
                         [value]="apellido1dni + ' ' + apellido2dni" disabled placeholder=" ">
                  <label for="apellidos">Apellidos</label>
                </div></div>
                <div class="col-12"><div class="form-floating">
                  <input type="text" class="form-control" id="direccion" name="direccion" [value]="direcciondni" disabled placeholder=" ">
                  <label for="direccion">Dirección</label>
                </div></div>
                <div class="col-md-4"><div class="form-floating">
                  <input type="text" class="form-control" id="cp" name="cp" [value]="cpdni" disabled placeholder=" ">
                  <label for="cp">Código postal</label>
                </div></div>
                <div class="col-md-4"><div class="form-floating">
                  <input type="text" class="form-control" id="provincia" name="provincia" [value]="provinciadni" disabled placeholder=" ">
                  <label for="provincia">Provincia</label>
                </div></div>
                <div class="col-md-4"><div class="form-floating">
                  <input type="text" class="form-control" id="municipio" name="municipio" [value]="nommunicipiodni" disabled placeholder=" ">
                  <label for="municipio">Municipio</label>
                </div></div>
              </div>

              <div class="row g-3 mt-2" *ngIf="veorepresentante">
                <div class="col-md-8"><div class="form-floating">
                  <input type="text" class="form-control" id="representante" name="representante"
                         [value]="representanteexplistar.desPerEntid" disabled placeholder=" ">
                  <label for="representante">Representante</label>
                </div></div>
                <div class="col-md-4 form-check d-flex align-items-center">
                  <input class="form-check-input" type="checkbox" id="seleccionoRepre" name="seleccionoRepre"
                         [(ngModel)]="seleccionoRepre" [ngModelOptions]="{standalone: true}" value="1">
                  <label class="form-check-label ms-2" for="seleccionoRepre">Asignar representante</label>
                </div>
              </div>

              <div class="modal-footer px-0 pb-0">
                <button type="button" class="btn-iflow btn-iflow--secondary" (click)="cerrarModal('ninteresadoModal')">Cancelar</button>
                <button type="submit" class="btn-iflow btn-iflow--primary">Guardar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal: Ver interesado -->
    <div class="modal fade" id="verInteresadoModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false"
         aria-labelledby="verInteresadoModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-xl">
        <div class="modal-content">
          <div class="modal-header">
            <h4 class="modal-title" id="verInteresadoModalLabel">Detalle del interesado</h4>
            <button type="button" class="btn-close" (click)="cerrarModal('verInteresadoModal')" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-6"><div class="form-floating">
                <input type="text" class="form-control" disabled [value]="nombreinteresado" id="verNombre" placeholder=" ">
                <label for="verNombre">Interesado</label>
              </div></div>
              <div class="col-md-6"><div class="form-floating">
                <input type="text" class="form-control" disabled [value]="numDocumInter" id="verDocInter" placeholder=" ">
                <label for="verDocInter">Documento</label>
              </div></div>
              <div class="col-md-4"><div class="form-floating">
                <input type="text" class="form-control" disabled [value]="veoprincipal ? 'Sí' : 'No'" id="verPrincipal" placeholder=" ">
                <label for="verPrincipal">Principal</label>
              </div></div>
              <div class="col-md-4"><div class="form-floating">
                <input type="text" class="form-control" disabled [value]="forNotif" id="verForNotif" placeholder=" ">
                <label for="verForNotif">Forma notificación</label>
              </div></div>
              <div class="col-md-4" *ngIf="veoemail"><div class="form-floating">
                <input type="text" class="form-control" disabled [value]="emailNotif" id="verEmail" placeholder=" ">
                <label for="verEmail">Email</label>
              </div></div>
              <div class="col-12"><div class="form-floating">
                <input type="text" class="form-control" disabled [value]="dirInter" id="verDirInter" placeholder=" ">
                <label for="verDirInter">Dirección interesado</label>
              </div></div>
              <div class="col-md-6"><div class="form-floating">
                <input type="text" class="form-control" disabled [value]="desMunicInter" id="verMunicInter" placeholder=" ">
                <label for="verMunicInter">Municipio</label>
              </div></div>
              <div class="col-md-6"><div class="form-floating">
                <input type="text" class="form-control" disabled [value]="desProviInter" id="verProviInter" placeholder=" ">
                <label for="verProviInter">Provincia</label>
              </div></div>
              <div class="col-md-6"><div class="form-floating">
                <input type="text" class="form-control" disabled [value]="nomRepre" id="verNomRepre" placeholder=" ">
                <label for="verNomRepre">Representante</label>
              </div></div>
              <div class="col-md-6"><div class="form-floating">
                <input type="text" class="form-control" disabled [value]="numDocumRepre" id="verDocRepre" placeholder=" ">
                <label for="verDocRepre">Documento representante</label>
              </div></div>
              <div class="col-12"><div class="form-floating">
                <input type="text" class="form-control" disabled [value]="dirRepre" id="verDirRepre" placeholder=" ">
                <label for="verDirRepre">Dirección representante</label>
              </div></div>
              <div class="col-md-6"><div class="form-floating">
                <input type="text" class="form-control" disabled [value]="desMunicRepre" id="verMunicRepre" placeholder=" ">
                <label for="verMunicRepre">Municipio representante</label>
              </div></div>
              <div class="col-md-6"><div class="form-floating">
                <input type="text" class="form-control" disabled [value]="desProviRepre" id="verProviRepre" placeholder=" ">
                <label for="verProviRepre">Provincia representante</label>
              </div></div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-iflow modal-footer__btn btn-iflow--secondary" (click)="cerrarModal('verInteresadoModal')">Cerrar</button>
          </div>
        </div>
      </div>
    </div>
  </ng-container>
</app-shell>

<div class="notifica-panel" *ngIf="veoEnviarNotifica || veoSincronizarNotifica || envioNotifica">
  <div class="notifica-envio-info small text-muted mb-1" *ngIf="envioNotifica">
    <span *ngIf="envioNotifica.idEnvioExterno">Envío Notifica: {{ envioNotifica.idEnvioExterno }}</span>
    <span *ngIf="envioNotifica.estadoNotifica"> — Estado: {{ envioNotifica.estadoNotifica }}</span>
    <span *ngIf="envioNotifica.idAcuseExterno"> — Acuse: {{ envioNotifica.idAcuseExterno }}</span>
  </div>

  <button *ngIf="veoEnviarNotifica" class="btn-iflow btn-iflow--primary" (click)="enviar.emit()"
    title="Enviar a Notifica" type="button">
    Enviar a Notifica <i class="bi bi-envelope-arrow-up" aria-hidden="true"></i>
  </button>

  <button *ngIf="veoSincronizarNotifica" class="btn-iflow btn-iflow--primary" (click)="sincronizar.emit()"
    title="Sincronizar con Notifica" type="button">
    Sincronizar Notifica <i class="bi bi-arrow-repeat" aria-hidden="true"></i>
  </button>
</div>

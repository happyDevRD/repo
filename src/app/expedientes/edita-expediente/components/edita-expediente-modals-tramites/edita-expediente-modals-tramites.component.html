                  Cancelar
                </button>
                <button class="btn-iflow modal-footer__btn btn-iflow--secondary" id="botonguardar" role="button" (click)="edita.crearnotificacion()"
                  [disabled]="!edita.formularioNotificacionValido" [class.btn-disabled]="!edita.formularioNotificacionValido">
                  <i class="fas fa-save me-2"></i>
                  Guardar Notificación
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>

    </div>

    <!-- Modal Baja Objeto Tributario -->
    <div class="modal fade iflow-modal" id="bajaObjetoTributarioModal" tabindex="-1"
      aria-labelledby="bajaObjetoTributarioModalLabel" aria-hidden="true" data-bs-backdrop="static">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="bajaObjetoTributarioModalLabel">Baja objeto tributario</h5>
            <button type="button" class="btn-close" iflowModalDismiss="bajaObjetoTributarioModal" aria-label="Cerrar"
              (click)="edita.cerrarModalBajaObjetoTributario()"></button>
          </div>
          <div class="modal-body">
            <div class="container py-3" *ngIf="edita.objetotributario && edita.tareatramiteprocedimiento?.accion === 5">

              <div class="card mb-4">
                <div class="card-header bg-primary text-white">
                  <h5 class="mb-0">Baja de Objeto Tributario</h5>
                </div>
                <div class="card-body">

                  <!-- Información General -->
                  <div class="row g-3">
                    <div class="col-md-4"><div class="form-floating">
                      <input type="text" class="form-control" id="tipoObjetoBaja"
                        [value]="edita.objetotributario.tipoObjetoTributario" disabled placeholder=" ">
                      <label for="tipoObjetoBaja">Tipo Objeto Tributario</label>
                    </div></div>
                    <div class="col-md-4"><div class="form-floating">
                      <input type="text" class="form-control" id="descripcionBaja"
                        [value]="edita.objetotributario.desObjTribu" disabled placeholder=" ">
                      <label for="descripcionBaja">Descripción</label>
                    </div></div>
                    <div class="col-md-4"><div class="form-floating">
                      <input type="text" class="form-control" id="fecAltaBaja" [value]="edita.objetotributario.fecAlta"
                        disabled placeholder=" ">
                      <label for="fecAltaBaja">Fecha Alta</label>
                    </div></div>
                  </div>

                  <div class="row g-3 mt-3">
                    <div class="col-md-4"><div class="form-floating">
                      <input type="text" class="form-control" id="numDocumBaja" [value]="edita.objetotributario.numDocum"
                        disabled placeholder=" ">
                      <label for="numDocumBaja">N.º Documento</label>
                    </div></div>
                    <div class="col-md-4"><div class="form-floating">
                      <input type="text" class="form-control" id="personaBaja"
                        [value]="edita.objetotributario.desPerEntid" disabled placeholder=" ">
                      <label for="personaBaja">Persona / Entidad</label>
                    </div></div>
                    <div class="col-md-4"><div class="form-floating">
                      <input type="text" class="form-control" id="domFiscalBaja"
                        [value]="edita.objetotributario.domFiscal" disabled placeholder=" ">
                      <label for="domFiscalBaja">Domicilio Fiscal</label>
                    </div></div>
                  </div>

                  <div class="row g-3 mt-3">
                    <div class="col-md-4"><div class="form-floating">
                      <input type="text" class="form-control" id="codMovimBaja" [value]="edita.objetotributario.codMovim"
                        disabled placeholder=" ">
                      <label for="codMovimBaja">Código Movimiento</label>
                    </div></div>
                    <div class="col-md-8 d-flex align-items-center" *ngIf="edita.objetotributario.codMovim === 'BAJA'">
                      <span class="text-danger fw-bold">Este objeto tributario ya está dado de baja.</span>
                    </div>
                  </div>

                  <!-- Observaciones y Botón de Baja (solo si no está ya de baja) -->
                  <div class="row g-3 mt-4" *ngIf="edita.objetotributario.codMovim !== 'BAJA'">
                    <div class="col-md-10"><div class="form-floating">
                      <textarea maxlength="200" class="form-control" id="observacionesBaja" name="observacionesBaja"
                        placeholder=" " [(ngModel)]="edita.objetotributario.observaciones" rows="4"></textarea>
                      <label for="observacionesBaja">Observaciones (opcional)</label>
                    </div></div>
                    <div class="col-md-2 d-flex align-items-end">
                      <button type="button" class="btn-iflow btn-iflow--primary w-100" (click)="edita.darDeBajaObjeto()">
                        Dar de Baja
                      </button>
                    </div>
                  </div>

                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

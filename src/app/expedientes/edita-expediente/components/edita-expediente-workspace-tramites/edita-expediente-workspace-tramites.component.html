        <!-- Título dinámico y botones -->
        <div class="listado-titulo-container titulo-separador">
          <h2 class="listado-titulo-principal">
            <!-- Título dinámico basado en la vista activa -->
            <span *ngIf="edita.vertramite && edita.botonVerNotifi">
              Listado de Trámites
            </span>
            <span *ngIf="edita.veonotificaciones">
              Listado de Notificaciones
            </span>
            <span *ngIf="edita.veoTramitadores">
              Listado de Tramitadores
            </span>
          </h2>
          <div *ngIf="edita.botonVerNotifi && edita.vertramite" class="titulo-botones-container">
            <button (click)="edita.habilitaTramiteExp(); edita.abrirModal('NuevoTramiteModal')" class="btn-iflow btn-iflow--icon"
              type="button" aria-label="Nuevo trámite" title="Nuevo Trámite">
              <i class="bi bi-plus-lg" aria-hidden="true"></i>
            </button>
            <button (click)="edita.borrarTramite()" *ngIf="edita.verasignatramite"
              class="btn-iflow btn-iflow--icon" type="button" aria-label="Borrar trámite" title="Borrar Trámite">
              <i class="bi bi-trash" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <!-- Grid de Trámites -->
        <div *ngIf="edita.vertramite" class="grid-container">
          <jqxGrid #grid (onRowclick)="edita.clickTramiteNuevo($event)" (onRowdoubleclick)="edita.onTramiteDoubleClick($event)"
            [altrows]="true" [autoheight]="true" [columns]="edita.columnsTramite" [columnsautoresize]="true"
            [filterable]="true" [localization]="edita.localizationObject" [pageable]="true" [pagesize]="10"
            [sortable]="true" [source]="edita.sourceTramite" [width]="'100%'" class="">
          </jqxGrid>
        </div>

        <!-- Botones de acciones de notificaciones -->
        <div *ngIf="edita.veonotificaciones && edita.verInfoNotifi && edita.idNotificacion" class="acciones-botones-container">
          <!-- Enviar T.E.U. -->
          <button *ngIf="edita.veoteu && !edita.veoReenviarTeu" class="btn-iflow btn-iflow--primary"
            title="Enviar T.E.U." type="button" (click)="edita.abrirModalEnvioTeu()">
            Enviar T.E.U. <i class="bi bi-envelope-arrow-up" aria-hidden="true"></i>
          </button>

          <!-- Reenviar T.E.U. -->
          <button *ngIf="edita.veoReenviarTeu" class="btn-iflow btn-iflow--primary"
            title="Reenviar T.E.U." type="button" (click)="edita.abrirModalEnvioTeu()">
            Reenviar T.E.U. <i class="bi bi-envelope-arrow-up" aria-hidden="true"></i>
          </button>

          <!-- Panel Notifica (plataforma PAe) -->
          <app-notificaciones-notifica-panel
            [veoEnviarNotifica]="edita.veoEnviarNotifica"
            [veoSincronizarNotifica]="edita.veoSincronizarNotifica"
            [envioNotifica]="edita.envioNotifica"
            (enviar)="edita.enviarANotificaPlataforma()"
            (sincronizar)="edita.sincronizarConNotificaPlataforma()">
          </app-notificaciones-notifica-panel>

          <!-- Enviar Notificación -->
          <button *ngIf="edita.veoenviar" class="btn-iflow btn-iflow--primary"
            title="Enviar Notificación" type="button" (click)="edita.abrirModal('EnvioNotifi')">
            Enviar <i class="bi bi-send" aria-hidden="true"></i>
          </button>

          <!-- Recepcionar Notificación -->
          <button *ngIf="edita.veorecepcionar" class="btn-iflow btn-iflow--primary"
            title="Recepcionar Notificación" type="button" (click)="edita.abrirModal('RecepNotifi')">
            Recepcionar <i class="bi bi-inbox-arrow-down" aria-hidden="true"></i>
          </button>

          <!-- Devolver Notificación -->
          <button *ngIf="edita.veodevolver" class="btn-iflow btn-iflow--primary"
            title="Devolver Notificación" type="button" (click)="edita.abrirModal('DevolverNotifi')">
            Devolver <i class="bi bi-arrow-return-left" aria-hidden="true"></i>
          </button>

          <!-- Publicar Notificación -->
          <button *ngIf="edita.veopublicar" class="btn-iflow btn-iflow--primary"
            title="Publicar Notificación" type="button" (click)="edita.abrirModal('PubliNotifModal')">
            Publicar <i class="bi bi-newspaper" aria-hidden="true"></i>
          </button>

          <!-- Anular Notificación -->
          <button *ngIf="edita.veoanular" class="btn-iflow btn-iflow--primary" (click)="edita.anularNotificacion()"
            title="Anular Notificación" type="button">
            Anular <i class="bi bi-ban"></i>
          </button>

          <!-- Ver/Editar Notificación -->
          <button class="btn-iflow btn-iflow--primary" (click)="edita.verNotificacion(edita.idNotificacion)" title="Ver Notificación"
            type="button">
            Ver <i class="bi bi-eye" aria-hidden="true"></i>
          </button>

          <!-- Borrar Notificación -->
          <button *ngIf="edita.veoborrar" class="btn-iflow btn-iflow--primary" (click)="edita.borrarNotificacion(edita.idNotificacion)"
            title="Borrar Notificación" type="button">
            Borrar <i class="bi bi-trash"></i>
          </button>

          <!-- Descargar Fichero TEU -->
          <button *ngIf="edita.mostrarBotonDescargaTEUPrincipal" class="btn-iflow btn-iflow--primary"
            (click)="edita.descargarFicheroTEU()" title="Descargar Fichero TEU" type="button">
            Descargar TEU <i class="bi bi-cloud-arrow-down"></i>
          </button>
        </div>

        <!-- Grid de Notificaciones -->
        <div *ngIf="edita.veonotificaciones" class="grid-container">
          <jqxGrid #gridNotificaciones (onRowclick)="edita.onNotificacionClick($event)" (onRowdoubleclick)="edita.onNotificacionDoubleClick($event)"
            [altrows]="true" [autoheight]="true" [columns]="edita.columnsListarNotifi" [columnsautoresize]="true"
            [filterable]="true" [localization]="edita.localizationObject" [pageable]="true" [pagesize]="10"
            [sortable]="true" [source]="edita.sourceListarNotifi" [width]="'100%'" class="">
          </jqxGrid>
        </div>

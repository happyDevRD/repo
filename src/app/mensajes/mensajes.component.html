<app-shell *ngIf="session.user">
<div class="page-panel">
          <div *ngIf="veorecibidos" class="col-12"> 
            <div class="listado-titulo-container titulo-separador">
              <div class="listado-titulo-info">
                <h2 class="listado-titulo-principal">Listado de Mensajes Recibidos</h2>
              </div>
              <div class="titulo-botones-container">
                <button (click)="verEnviados()" class="btn-iflow btn-iflow--primary" type="button" title="Ver Mensajes Enviados">
                  Enviados <i class="bi bi-envelope-arrow-up ms-2"></i>
                </button>
                <button *ngIf="veoRecha" type="button" (click)="abrirModal('DevolverMensajeModal')" class="btn-iflow btn-iflow--primary">
                  Rechazar <i class="bi bi-envelope-x ms-2"></i>
                </button>
                <button *ngIf="veorechaTRami" type="button" (click)="TramitarMensaje()" class="btn-iflow btn-iflow--primary">
                  Tramitar <i class="bi bi-arrow-left-right ms-2"></i>
                </button>
              </div>
            </div>
              
            <div class="grid-container">
            <jqxGrid class=""
              [width]="'100%'"
              [autoheight]="true"
              [columnsautoresize]="true"
              [source]="sourceMensajeRecibidos" 
              [pagesize]="10"
              [pageable]="true" 
              [altrows]="true" 
              [filterable]="true" 
              [sortable]="true" 
              (onRowclick)="ClickMensajesRecibidos($event)"
              (onRowdoubleclick)="abrirModalVerMensaje($event)"
              [columns]="columnsMensajeRecibidos" 
              [localization]="localizationObject"
              #grid>
            </jqxGrid>
            </div>
          </div>

          <div *ngIf="veoenviados" class="col-12">
            <div class="listado-titulo-container titulo-separador">
              <div class="listado-titulo-info">
                <h2 class="listado-titulo-principal">Listado de Mensajes Enviados</h2>
              </div>
              <div class="titulo-botones-container">
                <button (click)="verRecibidos()" class="btn-iflow btn-iflow--primary" type="button" title="Ver Mensajes Recibidos">
                  Recibidos <i class="bi bi-envelope-arrow-down ms-2"></i>
                </button>
              </div>
            </div>
            <div class="grid-container">
            <jqxGrid class=""
              [width]="'100%'"
              [autoheight]="true"
              [columnsautoresize]="true"
              [source]="sourceMensajeEnviados" 
              [pagesize]="10"
              [pageable]="true" 
              [altrows]="true" 
              [filterable]="true" 
              [sortable]="true" 
              (onRowclick)="ClickMensajesEnviados($event)"
              (onRowdoubleclick)="abrirModalVerMensaje($event)"
              [columns]="columnsMensajeEnviados" 
              [localization]="localizationObject"
              #grid>
            </jqxGrid>
            </div>
          </div>
        </div>

    <!-- ****************** zona para MODAL ************************************ -->


    <!--    EDITAR MENSAJE-->
    <div class="modal fade" id="EditarMensajeModal" tabindex="-1" aria-labelledby="EditarMensajeModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h4 class="modal-title" id="EditarMensajeModalLabel">Editar Mensaje</h4>
            <button type="button" class="btn-close" aria-label="Close" (click)="cerrarModal('EditarMensajeModal')"></button>
          </div>
          <div class="modal-body">
            <form id="formEditarMensaje" (ngSubmit)="validateAndEditMensaje($event)">
              <div class="row g-3">
                <div class="col-sm-6"><div class="form-floating">
                  <input type="text" class="form-control" [value]="leemensaje.descripcion" name="descripcionMensaje" id="descripcionMensaje" [(ngModel)]="editarmensaje.descripcion" required placeholder=" ">
                  <label for="descripcionMensaje">Descripción *</label>
                </div></div>
                <div class="col-sm-3"><div class="form-floating">
                  <select class="form-select" id="destinatario" name="destinatario" [(ngModel)]="editarmensaje.destinatario" required>
                    <option value="" disabled selected></option>
                    <option *ngFor="let procedipermisos of procedipermiso" [value]="procedipermisos.idOrgUsuar">
                      {{procedipermisos.usuario}}
                    </option>
                  </select>
                  <label for="destinatario">Destinatario *</label>
                </div></div>
                <div class="col-sm-3"><div class="form-floating">
                  <select class="form-select" required id="informativo" name="informativo" [(ngModel)]="editarmensaje.informativo">
                    <option value="" disabled selected></option>
                    <option value="true">Si</option>
                    <option value="false">No</option>
                  </select>
                  <label for="informativo">Informativo *</label>
                </div></div>
              </div>
              <br>
              <div class="row">
                <div class="col-sm-4"><div class="form-floating">
                  <input type="text" class="form-control" readonly [value]="leemensaje.estado" name="estado" id="estado" placeholder=" ">
                  <label for="estado">Estado</label>
                </div></div>
                <div class="col-sm-4"><div class="form-floating">
                  <input type="text" class="form-control" readonly [value]="leemensaje.fecLectura" name="fecLectura" id="fecLectura" placeholder=" ">
                  <label for="fecLectura">Fecha de lectura</label>
                </div></div>
                <div class="col-sm-4"><div class="form-floating">
                  <input type="text" class="form-control" readonly [value]="leemensaje.fecTramitacion" name="fecTramitacion" id="fecTramitacion" placeholder=" ">
                  <label for="fecTramitacion">Fecha de Tramitación</label>
                </div></div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn-iflow modal-footer__btn btn-iflow--secondary" (click)="cerrarModal('EditarMensajeModal')">Cancelar</button>
                <button type="submit" class="btn-iflow modal-footer__btn btn-iflow--primary">Guardar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <!--    RECHAZO MENSAJE-->
    <div class="modal fade" id="DevolverMensajeModal" tabindex="-1" aria-labelledby="DevolverMensajeModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h4 class="modal-title" id="DevolverMensajeModalLabel">Rechazar Mensaje</h4>
            <button type="button" class="btn-close" aria-label="Close" (click)="limpiaRechazarMensaje(); cerrarModal('DevolverMensajeModal')"></button>
          </div>
          <div class="modal-body">
            <form id="formRechazarMensaje" (ngSubmit)="validateAndRechazarMensaje($event)">
              <div class="mb-3"><div class="form-floating">
                <textarea class="form-control" name="descripcionRechazoMensaje" id="descripcionRechazoMensaje" [(ngModel)]="rechazamensaje.descripcionRechazo" required placeholder=" "></textarea>
                <label for="descripcionRechazoMensaje">Descripción Rechazo *</label>
              </div></div>
              <div class="modal-footer">
                <button type="button" class="btn-iflow modal-footer__btn btn-iflow--secondary" (click)="limpiaRechazarMensaje(); cerrarModal('DevolverMensajeModal')">Cancelar</button>
                <button type="submit" class="btn-iflow modal-footer__btn btn-iflow--primary">Guardar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    
    <!--    VER MENSAJE-->
    <div class="modal fade" id="VerMensajeModal" tabindex="-1" aria-labelledby="VerMensajeModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h4 class="modal-title" id="VerMensajeModalLabel">Ver Mensaje</h4>
            <button type="button" class="btn-close" aria-label="Close" (click)="cerrarModal('VerMensajeModal')"></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="row g-3">
                <div class="col-12 mb-3"><div class="form-floating">
                  <textarea class="form-control" disabled [value]="mensajeDescrip" name="descripcionMensaje" id="descripcionMensaje" placeholder=" "></textarea>
                  <label for="descripcionMensaje">Descripción</label>
                </div></div>
              </div>
              <div class="row">
                <div class="col-sm-3 mb-3"><div class="form-floating">
                  <input type="text" class="form-control" disabled [value]="mensajeFechaInicio" name="fechaInicio" id="fechaInicio" placeholder=" ">
                  <label for="fechaInicio">Fecha de Emisión</label>
                </div></div>
                <div class="col-sm-3 mb-3"><div class="form-floating">
                  <input type="text" class="form-control" disabled [value]="mensajeRemitente" name="remitente" id="remitente" placeholder=" ">
                  <label for="remitente">Remitente</label>
                </div></div>
                <div class="col-sm-3 mb-3"><div class="form-floating">
                  <input type="text" class="form-control" disabled [value]="mensajeDestinatario" name="destinatario" id="destinatario" placeholder=" ">
                  <label for="destinatario">Destinatario</label>
                </div></div>
                <div class="col-sm-3 mb-3"><div class="form-floating">
                  <input type="text" class="form-control" disabled [value]="mensajeEstado" name="estado" id="estado" placeholder=" ">
                  <label for="estado">Estado</label>
                </div></div>
              </div>
              <div class="row">
                <div class="col-sm-12 mb-3"><div class="form-floating">
                  <textarea class="form-control" disabled [value]="mensajeDescripcionRechazo" name="descripcionRechazo" id="descripcionRechazo" placeholder=" "></textarea>
                  <label for="descripcionRechazo">Descripción Rechazo</label>
                </div></div>
              </div>
              <div class="row">
                <div class="col-sm-4 mb-3"><div class="form-floating">
                  <input type="text" class="form-control" disabled [value]="mensajeFechaRechazo" name="fechaRechazo" id="fechaRechazo" placeholder=" ">
                  <label for="fechaRechazo">Fecha de Rechazo</label>
                </div></div>
                <div class="col-sm-4 mb-3"><div class="form-floating">
                  <input type="text" class="form-control" disabled [value]="mensajeFechaLectura" name="fechaLectura" id="fechaLectura" placeholder=" ">
                  <label for="fechaLectura">Fecha de lectura</label>
                </div></div>
                <div class="col-sm-4 mb-3"><div class="form-floating">
                  <input type="text" class="form-control" disabled [value]="mensajeFechaTramitacion" name="fechaTramitacion" id="fechaTramitacion" placeholder=" ">
                  <label for="fechaTramitacion">Fecha de Tramitación</label>
                </div></div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-iflow modal-footer__btn btn-iflow--secondary" (click)="marcarLeido(); cerrarModal('VerMensajeModal')">Cerrar</button>
          </div>
        </div>
      </div>
    </div>
    <!--    TRAMITAR MENSAJE-->
    <div class="modal fade" id="TramitarMensajeModal" tabindex="-1" aria-labelledby="TramitarMensajeModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h4 class="modal-title" id="TramitarMensajeModalLabel">Tramitar Mensaje</h4>
            <button type="button" class="btn-close" aria-label="Close" (click)="cerrarModal('TramitarMensajeModal')"></button>
          </div>
          <div class="modal-body">
            <form id="formTramitarMensaje" (ngSubmit)="validateAndTramitarMensaje($event)">
              <div class="row g-3">
                <div class="col-sm-6"><div class="form-floating">
                  <input type="text" class="form-control" [value]="leemensaje.descripcion" name="descripcionMensaje" id="descripcionMensaje" [(ngModel)]="editarmensaje.descripcion" required placeholder=" ">
                  <label for="descripcionMensaje">Descripción *</label>
                </div></div>
                <div class="col-sm-3"><div class="form-floating">
                  <select class="form-select" id="destinatario" name="destinatario" [(ngModel)]="editarmensaje.destinatario" required>
                    <option value="" disabled selected></option>
                    <option *ngFor="let procedipermisos of procedipermiso" [value]="procedipermisos.idOrgUsuar">
                      {{procedipermisos.usuario}}
                    </option>
                  </select>
                  <label for="destinatario">Destinatario *</label>
                </div></div>
                <div class="col-sm-3"><div class="form-floating">
                  <select class="form-select" required id="informativo" name="informativo" [(ngModel)]="editarmensaje.informativo">
                    <option value="" disabled selected></option>
                    <option value="true">Si</option>
                    <option value="false">No</option>
                  </select>
                  <label for="informativo">Informativo *</label>
                </div></div>
              </div>
              <br>
              <div class="row">
                <div class="col-sm-4"><div class="form-floating">
                  <input type="text" class="form-control" readonly [value]="leemensaje.estado" name="estado" id="estado" placeholder=" ">
                  <label for="estado">Estado</label>
                </div></div>
                <div class="col-sm-4"><div class="form-floating">
                  <input type="text" class="form-control" readonly [value]="leemensaje.fecLectura" name="fecLectura" id="fecLectura" placeholder=" ">
                  <label for="fecLectura">Fecha de lectura</label>
                </div></div>
                <div class="col-sm-4"><div class="form-floating">
                  <input type="text" class="form-control" readonly [value]="leemensaje.fecTramitacion" name="fecTramitacion" id="fecTramitacion" placeholder=" ">
                  <label for="fecTramitacion">Fecha de Tramitación</label>
                </div></div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn-iflow modal-footer__btn btn-iflow--secondary" (click)="cerrarModal('TramitarMensajeModal')">Cancelar</button>
                <button type="submit" class="btn-iflow modal-footer__btn btn-iflow--primary">Guardar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
</app-shell>

<header class="app-topbar" role="banner">
  <div class="app-topbar__inner">
    <button type="button"
            class="app-topbar__menu-btn"
            (click)="toggleMobileMenu()"
            [attr.aria-expanded]="mobileMenuOpen"
            aria-controls="sidebar"
            aria-label="Abrir o cerrar menú de navegación">
      <i class="bi" [ngClass]="mobileMenuOpen ? 'bi-x-lg' : 'bi-list'" aria-hidden="true"></i>
    </button>

    <h1 class="app-topbar__title">{{ pageTitle || title }}</h1>

    <div class="app-topbar__user">
      <i class="bi bi-person-circle app-topbar__user-icon" aria-hidden="true"></i>
      <div class="app-topbar__user-text">
        <span class="app-topbar__user-name">{{ userName }}</span>
        <span class="app-topbar__user-dept" *ngIf="departmentName">{{ departmentName }}</span>
      </div>
    </div>
  </div>
</header>

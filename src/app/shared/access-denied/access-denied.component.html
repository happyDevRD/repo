<div class="access-denied" role="alert">
  <div class="access-denied__icon" aria-hidden="true">
    <i class="bi bi-shield-lock"></i>
  </div>
  <h2 class="access-denied__title">{{ title }}</h2>
  <p class="access-denied__message">{{ message }}</p>
  <img src="assets/greenaall_logo.svg" alt="Greenaall" class="access-denied__logo" width="180" height="90">
</div>

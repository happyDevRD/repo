<header class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3 pb-3 border-bottom">
  <div class="d-flex align-items-center gap-3">
    <ng-content select="[start]"></ng-content>
    <div *ngIf="eyebrow || title">
      <p class="text-uppercase small fw-semibold text-secondary mb-1" style="letter-spacing:.06em" *ngIf="eyebrow">{{ eyebrow }}</p>
      <h2 class="h4 fw-bold mb-0" *ngIf="title">{{ title }}</h2>
    </div>
  </div>
  <div class="d-flex flex-wrap gap-2">
    <ng-content select="[actions]"></ng-content>
  </div>
</header>
